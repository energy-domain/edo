name: Phase A Lot 6 AAR pair audit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Compare baseline and current hasAttribute pairs
        shell: bash
        run: |
          git show 85b7ac4fea18efd1061548a76364e821946f13a3:core/edo-object-relations.ttl > /tmp/baseline.ttl
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          def local(u):
              s=str(u); return s.split('#')[-1] if '#' in s else s
          def pairs(path):
              g=Graph().parse(path,format='turtle')
              out=set()
              for c,r in g.subject_objects(RDFS.subClassOf):
                  if not str(c).startswith(str(EDO)): continue
                  if (r,OWL.onProperty,EDO.hasAttribute) not in g: continue
                  fillers=set(g.objects(r,OWL.onClass))|set(g.objects(r,OWL.someValuesFrom))|set(g.objects(r,OWL.allValuesFrom))
                  for f in fillers:
                      if str(f).startswith(str(EDO)): out.add((local(c),local(f)))
              return g,out
          gb,b=pairs('/tmp/baseline.ttl'); gc,c=pairs('core/edo-object-relations.ttl')
          print('BASELINE_PAIRS',len(b),'CURRENT_PAIRS',len(c),'REMOVED',len(b-c),'ADDED',len(c-b))
          print('\nREMOVED_PAIRS')
          for x in sorted(b-c): print('REMOVED',x[0],x[1])
          print('\nCURRENT_PAIRS')
          for x in sorted(c): print('CURRENT',x[0],x[1])
          print('\nADDED_PAIRS')
          for x in sorted(c-b): print('ADDED',x[0],x[1])

          # P22 protected roots used during Lot 4.
          roots=['AxialCompressionCurve','AxialStiffnessCurve','BendingMomentCurvatureCurve','BendingStiffnessCurve','CollapsePressureCurve','CrushingCurve','FrictionCurve','HydrostaticPressureCurve','LateralBucklingCurve','MaterialCurve','RadialCompressionCurve','StressStrainCurve','TensileCurve','TorsionCurve','TorsionalStiffnessCurve']
          # Descendants by rdfs:subClassOf named edges, transitive.
          parents={}
          for ch,pa in gb.subject_objects(RDFS.subClassOf):
              if str(ch).startswith(str(EDO)) and str(pa).startswith(str(EDO)):
                  parents.setdefault(ch,set()).add(pa)
          def under(node,root):
              seen=set(); stack=[node]
              target=EDO[root]
              while stack:
                  cur=stack.pop()
                  if cur==target:return True
                  for p in parents.get(cur,()):
                      if p not in seen: seen.add(p); stack.append(p)
              return False
          p22=set()
          for cls,att in b:
              if any(under(EDO[att],r) for r in roots): p22.add((cls,att))
          print('\nP22_PAIRS',len(p22))
          for x in sorted(p22): print('P22',x[0],x[1])

          # Removed resource classes no longer present in target.
          print('\nREMOVED_ATTRIBUTE_RESOURCES')
          for cls,att in sorted(b-c):
              exists=any(gc.triples((EDO[att],None,None)))
              if not exists: print('RESOURCE_GONE',cls,att)

          # Current AAR count should still be zero at this stage.
          print('\nCURRENT_AAR_INSTANCES',sum(1 for _ in gc.subjects(RDF.type,EDO.AttributeApplicabilityRule)))
          PY
      - name: Remove audit runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot6-aar-pair-audit.yml
          git commit -m "Record Lot 6 AAR pair audit"
          git push origin HEAD:audit-evolution-phase-a-implementation
