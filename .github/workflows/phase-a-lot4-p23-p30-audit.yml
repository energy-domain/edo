name: Phase A Lot 4 P23 P30 residual audit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - name: Audit P23 and P30 old/new term references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          terms=[
            'NominalFloatVolume','NominalFloatDensity',
            'ShortTermFloatVolume','ShortTermFloatDensity','LongTermFloatVolume','LongTermFloatDensity',
            'StartOfLifeFloatVolume','StartOfLifeFloatDensity','EndOfLifeFloatVolume','EndOfLifeFloatDensity',
            'IdInUnifilarDiagram','IdInSingleLineDiagram','SpecialRequirements'
          ]
          skip={'.git'}
          for term in terms:
              hits=[]
              for p in Path('.').rglob('*'):
                  if not p.is_file() or any(part in skip for part in p.parts): continue
                  try: txt=p.read_text(encoding='utf-8')
                  except Exception: continue
                  for i,line in enumerate(txt.splitlines(),1):
                      if term in line: hits.append((str(p),i,line.strip()))
              print('\nTERM',term,'HITS',len(hits))
              for h in hits: print(' ',h)
          PY
      - name: Remove audit runner
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot4-p23-p30-audit.yml
          git commit -m "Record Lot 4 P23 P30 residual audit"
          git push origin HEAD:audit-evolution-phase-a-implementation
