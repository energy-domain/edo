name: Phase A Lot 4 P22 protection audit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Audit tabular grouping ancestry
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDFS, URIRef
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')
          phase=EDO.hasLifecycleCreationPhase
          # Print current named grouping-like classes and all phase-bearing descendants.
          named=set(s for s in g.subjects(RDFS.subClassOf,None) if isinstance(s,URIRef) and str(s).startswith(str(EDO)))
          candidates=[]
          for root in sorted(named,key=str):
              n=str(root).split('#')[-1]
              if not any(k in n for k in ['TableAttribute','TableColumn','CurveAttribute','ProfileAttribute']):
                  continue
              desc=set(); frontier=[root]
              while frontier:
                  p=frontier.pop()
                  if p in desc: continue
                  desc.add(p)
                  for c in g.subjects(RDFS.subClassOf,p):
                      if isinstance(c,URIRef): frontier.append(c)
              phased=sorted((str(s).split('#')[-1],sorted(str(o).split('#')[-1] for o in g.objects(s,phase))) for s in desc if any(g.objects(s,phase)))
              if phased: candidates.append((n,len(desc),phased))
          print('GROUPING_CANDIDATES_WITH_PHASED_DESCENDANTS',len(candidates))
          for n,cnt,phased in candidates:
              print('\nROOT',n,'DESC',cnt,'PHASED',len(phased))
              for item in phased: print(' ',item)
          PY
      - name: Remove audit runners
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot4-p22-audit.yml
          git commit -m "Record Lot 4 P22 protection audit"
          git push origin HEAD:audit-evolution-phase-a-implementation
