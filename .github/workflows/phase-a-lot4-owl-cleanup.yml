name: Phase A Lot 4 PT-03 OWL cleanup

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0

      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4

      - name: Apply approved PT-03 OWL cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from rdflib import Graph, Namespace, RDFS, URIRef

          P = Path('core/edo-object-relations.ttl')
          text = P.read_text(encoding='utf-8')
          EDO = Namespace('https://w3id.org/energy-domain/edo#')
          g0 = Graph().parse(P, format='turtle')

          # ---------- helpers ----------
          def split_blocks(s):
              return re.split(r'(\n{2,})', s)

          def subject_name(block):
              m = re.match(r'edo:([^\s]+)\s+a\s+', block)
              return m.group(1) if m else None

          def block_map(parts):
              out = {}
              for i in range(0, len(parts), 2):
                  n = subject_name(parts[i])
                  if n:
                      out[n] = i
              return out

          def restriction_spans(block):
              spans=[]
              pos=0
              needle='[ a owl:Restriction ;'
              while True:
                  start=block.find(needle,pos)
                  if start < 0: break
                  depth=0; end=None
                  for j in range(start,len(block)):
                      ch=block[j]
                      if ch=='[': depth += 1
                      elif ch==']':
                          depth -= 1
                          if depth==0:
                              end=j+1; break
                  if end is None: raise SystemExit('Unbalanced restriction block')
                  spans.append((start,end,block[start:end]))
                  pos=end
              return spans

          def remove_restriction(parts, byname, cls, required):
              if cls not in byname: raise SystemExit(f'Missing class block {cls}')
              i=byname[cls]; block=parts[i]
              matches=[x for x in restriction_spans(block) if all(k in x[2] for k in required)]
              if len(matches)!=1:
                  raise SystemExit(f'{cls}: expected exactly 1 matching restriction for {required}, got {len(matches)}')
              start,end,_=matches[0]
              # Prefer removing the following comma + indentation; otherwise preceding separator.
              m=re.match(r',\n\s*',block[end:])
              if m:
                  block=block[:start]+block[end+m.end():]
              else:
                  pm=list(re.finditer(r',\n\s*$',block[:start]))
                  if pm:
                      p=pm[-1]
                      block=block[:p.start()]+block[end:]
                  else:
                      raise SystemExit(f'{cls}: cannot safely remove restriction separator')
              parts[i]=block

          def replace_restriction_filler(parts, byname, cls, prop, old, new):
              i=byname[cls]; block=parts[i]
              matches=[x for x in restriction_spans(block)
                       if f'owl:onProperty edo:{prop}' in x[2] and f'owl:allValuesFrom edo:{old}' in x[2]]
              if len(matches)!=1:
                  raise SystemExit(f'{cls}: expected one {prop} only {old}, got {len(matches)}')
              start,end,frag=matches[0]
              frag2=frag.replace(f'owl:allValuesFrom edo:{old}',f'owl:allValuesFrom edo:{new}')
              parts[i]=block[:start]+frag2+block[end:]

          def sections(block):
              lines=block.splitlines(); header=[]; out=[]; cur=None
              for line in lines:
                  m=re.match(r'^    ([A-Za-z_][\w-]*:[\w-]+)\s+',line)
                  if m:
                      if cur: out.append(cur)
                      cur=[m.group(1),[line]]
                  else:
                      if cur: cur[1].append(line)
                      else: header.append(line)
              if cur: out.append(cur)
              return header,out

          def serialize(header,secs):
              for j,(_,ls) in enumerate(secs):
                  punct='.' if j==len(secs)-1 else ';'
                  ls[-1]=re.sub(r'\s*[;.](\s*)$',r'\1',ls[-1]).rstrip()+f' {punct}'
              return '\n'.join(header+[ln for _,ls in secs for ln in ls])

          def set_phase(parts, byname, name, phases):
              i=byname[name]; h,s=sections(parts[i])
              s=[x for x in s if x[0] != 'edo:hasLifecycleCreationPhase']
              if phases:
                  vals=',\n        '.join(f'edo:{p}' for p in phases)
                  s.append(['edo:hasLifecycleCreationPhase',[f'    edo:hasLifecycleCreationPhase {vals}']])
              parts[i]=serialize(h,s)

          parts=split_blocks(text)
          byname=block_map(parts)

          # ---------- explicit restriction removals ----------
          targets=[
            ('Asset',['owl:onProperty edo:hasAttribute','owl:onClass edo:IsSpare','owl:qualifiedCardinality "1"']),
            ('Asset',['owl:onProperty edo:hasAttribute','owl:onClass edo:SerialNumber','owl:qualifiedCardinality "1"']),
            ('AnodeCollarSet',['owl:onProperty edo:hasAttribute','owl:onClass edo:MetallicStrandSpareQuantity','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeEnvelope',['owl:onProperty edo:hasAttribute','owl:onClass edo:RequiredRiserConfiguration','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:IdInUnifilarDiagram','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:SpecialRequirements','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:MaxLengthTolerance','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:ManufacturingNonConformities','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:AssemblyShouldObeyModelPolarity','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:PipeSectionApplication','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:ManufacturingDate','owl:qualifiedCardinality "1"']),
            ('DesignOperatingCondition',['owl:onProperty edo:hasOperatingState','owl:someValuesFrom edo:DesignOperatingState']),
            ('SubseaOilField',['owl:onProperty edo:spatiallyContains','owl:someValuesFrom edo:FloatingProductionUnit']),
            ('SubseaWell',['owl:onProperty edo:serves','owl:someValuesFrom edo:FloatingProductionUnit']),
            ('SubseaWell',['owl:onProperty edo:hosts','owl:someValuesFrom edo:WetChristmasTree']),
            ('RiserBalcony',['owl:onProperty edo:hosts','owl:someValuesFrom edo:RiserSupport']),
            ('Process',['owl:onProperty edo:hasTask','owl:allValuesFrom edo:Task']),
            ('Task',['owl:onProperty edo:hasEvidence','owl:allValuesFrom edo:Evidence']),
            ('Task',['owl:onProperty edo:hasIssue','owl:allValuesFrom edo:Issue']),
            ('Task',['owl:onProperty edo:hasResponsibleAgent','owl:allValuesFrom edo:Agent']),
            ('ConnectionInterface',['owl:onProperty edo:hasInterfaceSpecification','owl:allValuesFrom edo:ConnectionInterfaceSpecification']),
            ('ElectricalJumper',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('ElectricalJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricalControlPort']),
            ('ElectricalJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('ElectricalPowerJumper',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('ElectricalPowerJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricalPowerPort']),
            ('ElectricalPowerJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('FiberOpticJumper',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:DataPort']),
            ('ConnectionInterface',['owl:onProperty edo:isEndInterfaceOf','owl:onClass edo:LinearEnd','owl:maxQualifiedCardinality "1"']),
            ('FunctionLineEnd',['owl:onProperty edo:isTerminatedBy','owl:onClass edo:DomainElement','owl:minQualifiedCardinality "1"']),
            ('TubingEnd',['owl:onProperty edo:isTerminatedBy','owl:onClass edo:TubingCoupling','owl:minQualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasEnd','owl:onClass edo:FlexiblePipeSegmentEnd','owl:qualifiedCardinality "2"']),
            ('UmbilicalSegment',['owl:onProperty edo:hasEnd','owl:onClass edo:UmbilicalEnd','owl:qualifiedCardinality "2"']),
            ('ElectricalCable',['owl:onProperty edo:hasEnd','owl:onClass edo:ElectricalCableEnd','owl:qualifiedCardinality "2"']),
            ('ElectricalControlCable',['owl:onProperty edo:hasEnd','owl:onClass edo:ElectricalControlCableEnd','owl:qualifiedCardinality "2"']),
            ('ElectricalPowerCable',['owl:onProperty edo:hasEnd','owl:onClass edo:ElectricalPowerCableEnd','owl:qualifiedCardinality "2"']),
            ('OpticalFiberCable',['owl:onProperty edo:hasEnd','owl:onClass edo:OpticalFiberCableEnd','owl:qualifiedCardinality "2"']),
            ('Tubing',['owl:onProperty edo:hasEnd','owl:onClass edo:TubingEnd','owl:qualifiedCardinality "2"']),
            ('TubingCoupling',['owl:onProperty edo:hasConnectionPoint','owl:onClass edo:FluidPort','owl:minQualifiedCardinality "2"']),
            ('GalvanicConnection',['owl:onProperty edo:hasPart','owl:onClass edo:MetallicStrandSet','owl:minQualifiedCardinality "1"']),
            ('GalvanicConnection',['owl:onProperty edo:hasPart','owl:allValuesFrom edo:MetallicStrandSet']),
            ('FlexibleStructureLayer',['owl:onProperty edo:hasMaterialSpecification','owl:allValuesFrom edo:MaterialSpecification']),
            ('OpticalFiberCableEnd',['owl:onProperty edo:exposesInterface','owl:allValuesFrom edo:DataPort']),
          ]
          for cls,req in targets:
              remove_restriction(parts,byname,cls,req)

          # P71: canonical connectorized fillers for electrical jumpers.
          replace_restriction_filler(parts,byname,'ElectricalJumper','hasConnectionPoint','ElectricalControlPort','ElectricalControlConnectorPort')
          replace_restriction_filler(parts,byname,'ElectricalPowerJumper','hasConnectionPoint','ElectricalPowerPort','ElectricalPowerConnectorPort')

          # P72: LineAncillary is not a constitutive part of FlexiblePipeSegment.
          i=byname['FlexiblePipeSegment']; block=parts[i]
          matches=[x for x in restriction_spans(block)
                   if 'owl:onProperty edo:hasPart' in x[2] and 'owl:unionOf' in x[2]
                   and 'edo:FlexiblePipeBody' in x[2] and 'edo:EndFitting' in x[2] and 'edo:LineAncillary' in x[2]]
          if len(matches)!=1:
              raise SystemExit(f'Expected one FlexiblePipeSegment hasPart union with LineAncillary, got {len(matches)}')
          start,end,frag=matches[0]
          frag2=re.sub(r'\n\s*edo:LineAncillary\b','',frag,count=1)
          if frag2==frag: raise SystemExit('Could not remove LineAncillary from FlexiblePipeSegment closure')
          parts[i]=block[:start]+frag2+block[end:]

          # Rebuild after structural edits.
          text=''.join(parts)
          P.write_text(text,encoding='utf-8')
          gmid=Graph().parse(P,format='turtle')
          parts=split_blocks(text); byname=block_map(parts)

          # ---------- lifecycle phase normalization P35-P53 ----------
          # P22: protect current tabular structures pending EngineeringDataSet refactor.
          table_roots=[
            'BendingMomentTable','BendMomentVsShearForceTable','DiffusionTable','EarlyLeakMaxPressTable',
            'EarlyLeakNomPressTable','EModVsTempTable','FrictionCoefficientTighteningTable',
            'InternalIncidentalPressureTable','LayingMinimumRadiusTable','MaxDesignAbsIntPresTable',
            'MaximumAllowableTensionTable','MaximumAllowableTighteningTable','PermeabilityTable',
            'SolubilityTable','StrandsTable'
          ]
          exempt=set()
          frontier=[EDO[x] for x in table_roots]
          while frontier:
              parent=frontier.pop()
              if parent in exempt: continue
              exempt.add(parent)
              for child in gmid.subjects(RDFS.subClassOf,parent):
                  if isinstance(child,URIRef): frontier.append(child)
          # Extra name-prefix protection follows the explicit 15 current grouping identifiers.
          prefixes=tuple(x+'_' for x in table_roots)
          for s in set(gmid.subjects()):
              if isinstance(s,URIRef) and str(s).startswith(str(EDO)):
                  n=str(s).split('#')[-1]
                  if n.startswith(prefixes): exempt.add(s)

          # All DomainAttribute subclasses, recursively.
          dattrs=set(); frontier=[EDO.DomainAttribute]
          while frontier:
              parent=frontier.pop()
              for child in gmid.subjects(RDFS.subClassOf,parent):
                  if isinstance(child,URIRef) and child not in dattrs:
                      dattrs.add(child); frontier.append(child)

          phase_pred=EDO.hasLifecycleCreationPhase
          before_table={str(s).split('#')[-1]:sorted(str(o).split('#')[-1] for o in gmid.objects(s,phase_pred))
                        for s in exempt if any(gmid.objects(s,phase_pred))}
          Path('/tmp/lot4_table_phases.txt').write_text(repr(before_table),encoding='utf-8')

          positive={
            'SerialNumber':['Fabrication'],
            'ManufacturingDate':['Fabrication'],
            'ManufacturingNonConformities':['Fabrication'],
            'FatMaxPress':['Fabrication'],
            'FatNomPress':['Fabrication'],
            'InstalledWaterDepth':['Installation'],
            'InstalledLength':['Installation'],
          }

          phase_changes=[]
          for s in sorted(dattrs,key=str):
              name=str(s).split('#')[-1]
              if name not in byname: continue
              current=sorted(str(o).split('#')[-1] for o in gmid.objects(s,phase_pred))
              if s in exempt:
                  desired=current
              elif name in positive:
                  desired=positive[name]
              else:
                  desired=[p for p in current if p not in {'BasicDesign','DetailedDesign'}]
                  if name=='CertifiedMaxWaterDepth':
                      desired=[p for p in desired if p!='Commissioning']
              if sorted(current)!=sorted(desired):
                  set_phase(parts,byname,name,desired)
                  phase_changes.append((name,current,desired))

          P.write_text(''.join(parts),encoding='utf-8')
          print('restriction_removals',len(targets))
          print('phase_changes',len(phase_changes))
          print('table_phase_subjects_protected',len(before_table))
          print('phase_change_sample',phase_changes[:30])
          PY

      - name: Verify Lot 4 cleanup gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from rdflib import Graph, Namespace, RDF, RDFS, OWL, URIRef
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')

          def rs(cls,prop):
              return [r for r in g.objects(EDO[cls],RDFS.subClassOf) if (r,OWL.onProperty,EDO[prop]) in g]
          def has_some(cls,prop,filler): return any((r,OWL.someValuesFrom,EDO[filler]) in g for r in rs(cls,prop))
          def has_only(cls,prop,filler): return any((r,OWL.allValuesFrom,EDO[filler]) in g for r in rs(cls,prop))
          def has_q(cls,prop,filler,pred,n):
              return any((r,OWL.onClass,EDO[filler]) in g and any(int(v)==n for v in g.objects(r,pred)) for r in rs(cls,prop))

          # Removed contextual/redundant restrictions.
          assert not has_q('Asset','hasAttribute','IsSpare',OWL.qualifiedCardinality,1)
          assert not has_q('Asset','hasAttribute','SerialNumber',OWL.qualifiedCardinality,1)
          assert not has_some('DesignOperatingCondition','hasOperatingState','DesignOperatingState')
          assert not has_some('SubseaOilField','spatiallyContains','FloatingProductionUnit')
          assert not has_some('SubseaWell','serves','FloatingProductionUnit')
          assert not has_some('SubseaWell','hosts','WetChristmasTree')
          assert not has_some('RiserBalcony','hosts','RiserSupport')
          assert not has_only('Process','hasTask','Task')
          assert not has_only('Task','hasEvidence','Evidence')
          assert not has_only('Task','hasIssue','Issue')
          assert not has_only('Task','hasResponsibleAgent','Agent')
          assert not has_only('ConnectionInterface','hasInterfaceSpecification','ConnectionInterfaceSpecification')
          assert not rs('ConnectionInterface','isEndInterfaceOf')
          assert not has_q('FunctionLineEnd','isTerminatedBy','DomainElement',OWL.minQualifiedCardinality,1)
          assert not has_q('TubingEnd','isTerminatedBy','TubingCoupling',OWL.minQualifiedCardinality,1)
          assert not has_q('TubingCoupling','hasConnectionPoint','FluidPort',OWL.minQualifiedCardinality,2)
          assert not has_q('GalvanicConnection','hasPart','MetallicStrandSet',OWL.minQualifiedCardinality,1)
          assert not has_only('GalvanicConnection','hasPart','MetallicStrandSet')
          assert not has_only('FlexibleStructureLayer','hasMaterialSpecification','MaterialSpecification')
          assert not has_only('OpticalFiberCableEnd','exposesInterface','DataPort')
          assert not has_only('FiberOpticJumper','hasConnectionPoint','DataPort')

          # Preserved truths and narrowed closures.
          assert has_some('FlexiblePipeEnvelope','hasOperatingCondition','DesignOperatingCondition')
          assert has_some('FloatingProductionUnit','hasPart','RiserBalcony')
          assert has_some('WetChristmasTree','hasPart','ConnectionModule')
          assert has_q('Process','hasTask','Task',OWL.minQualifiedCardinality,1)
          assert has_q('ConnectionInterface','hasInterfaceSpecification','ConnectionInterfaceSpecification',OWL.qualifiedCardinality,1)
          assert has_q('ConnectionInterface','isInterfaceConnectedTo','ConnectionInterface',OWL.maxQualifiedCardinality,1)
          assert has_only('FiberOpticJumper','hasConnectionPoint','OpticalConnectorPort')
          assert has_only('ElectricalJumper','hasConnectionPoint','ElectricalControlConnectorPort')
          assert has_only('ElectricalPowerJumper','hasConnectionPoint','ElectricalPowerConnectorPort')
          assert has_q('LinearObject','hasEnd','LinearEnd',OWL.qualifiedCardinality,2)
          assert has_q('FunctionLine','hasEnd','FunctionLineEnd',OWL.qualifiedCardinality,2)
          assert has_q('FlexiblePipeBody','hasEnd','FlexiblePipeBodyEnd',OWL.qualifiedCardinality,2)
          assert has_q('FlexibleStructureLayer','hasMaterialSpecification','MaterialSpecification',OWL.qualifiedCardinality,1)
          assert has_only('OpticalFiberCableEnd','exposesInterface','OpticalPort')

          # FlexiblePipeSegment constitutive closure excludes LineAncillary.
          fps_parts=rs('FlexiblePipeSegment','hasPart')
          union_nodes=[]
          for r in fps_parts:
              for c in g.objects(r,OWL.allValuesFrom):
                  if (c,OWL.unionOf,None) in g: union_nodes.append(c)
          assert len(union_nodes)==1
          u=union_nodes[0]
          # Traverse RDF list.
          RDF_NS=RDF
          head=g.value(u,OWL.unionOf); vals=[]
          while head and head!=RDF.nil:
              vals.append(g.value(head,RDF.first)); head=g.value(head,RDF.rest)
          assert set(vals)=={EDO.FlexiblePipeBody,EDO.EndFitting}, vals

          # Lifecycle normalization: P22 table structures remain protected.
          table_roots=['BendingMomentTable','BendMomentVsShearForceTable','DiffusionTable','EarlyLeakMaxPressTable','EarlyLeakNomPressTable','EModVsTempTable','FrictionCoefficientTighteningTable','InternalIncidentalPressureTable','LayingMinimumRadiusTable','MaxDesignAbsIntPresTable','MaximumAllowableTensionTable','MaximumAllowableTighteningTable','PermeabilityTable','SolubilityTable','StrandsTable']
          exempt=set(); frontier=[EDO[x] for x in table_roots]
          while frontier:
              p=frontier.pop()
              if p in exempt: continue
              exempt.add(p)
              for c in g.subjects(RDFS.subClassOf,p):
                  if isinstance(c,URIRef): frontier.append(c)
          prefixes=tuple(x+'_' for x in table_roots)
          for s in set(g.subjects()):
              if isinstance(s,URIRef) and str(s).startswith(str(EDO)) and str(s).split('#')[-1].startswith(prefixes): exempt.add(s)

          bad=[]
          for s,o in g.subject_objects(EDO.hasLifecycleCreationPhase):
              name=str(o).split('#')[-1]
              if name in {'BasicDesign','DetailedDesign'} and s not in exempt:
                  bad.append((str(s).split('#')[-1],name))
          assert not bad, f'Non-P22 residual Basic/Detailed phases: {bad[:20]}'
          assert not list(g.objects(EDO.CertifiedMaxWaterDepth,EDO.hasLifecycleCreationPhase))
          for n in ['SerialNumber','ManufacturingDate','ManufacturingNonConformities','FatMaxPress','FatNomPress']:
              vals=set(g.objects(EDO[n],EDO.hasLifecycleCreationPhase))
              assert vals=={EDO.Fabrication},(n,vals)
          for n in ['InstalledWaterDepth','InstalledLength']:
              vals=set(g.objects(EDO[n],EDO.hasLifecycleCreationPhase))
              assert vals=={EDO.Installation},(n,vals)

          # No accidental global functional/inverse-functional promotion.
          for p in g.subjects(RDF.type,OWL.FunctionalProperty):
              if str(p).startswith(str(EDO)): raise AssertionError(('unexpected FunctionalProperty',p))
          for p in g.subjects(RDF.type,OWL.InverseFunctionalProperty):
              if str(p).startswith(str(EDO)): raise AssertionError(('unexpected InverseFunctionalProperty',p))

          print('triples',len(g))
          print('lifecycle_phase_assertions',sum(1 for _ in g.triples((None,EDO.hasLifecycleCreationPhase,None))))
          print('P22_phase_subjects',sum(1 for s in exempt if any(g.objects(s,EDO.hasLifecycleCreationPhase))))
          print('Lot 4 cleanup gate OK')
          PY
          git diff --check
          git diff --stat

      - name: Commit verified Lot 4 cleanup and remove runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot4-owl-cleanup.yml
          git add core/edo-object-relations.ttl
          git diff --cached --check
          git commit -m "Implement PT-03 OWL cleanup pass"
          git push origin HEAD:audit-evolution-phase-a-implementation
