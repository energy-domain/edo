name: Phase A Lot 4 PT-03 OWL cleanup v2

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Apply approved PT-03 cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, ast
          from rdflib import Graph, Namespace, RDFS, URIRef
          P=Path('core/edo-object-relations.ttl')
          text=P.read_text(encoding='utf-8')
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g0=Graph().parse(P,format='turtle')

          def split_blocks(s): return re.split(r'(\n{2,})',s)
          def subject_name(block):
              m=re.match(r'edo:([^\s]+)\s+a\s+',block); return m.group(1) if m else None
          def block_map(parts):
              return {subject_name(parts[i]):i for i in range(0,len(parts),2) if subject_name(parts[i])}
          def restriction_spans(block):
              out=[]; pos=0; needle='[ a owl:Restriction ;'
              while True:
                  start=block.find(needle,pos)
                  if start<0: break
                  depth=0; end=None
                  for j in range(start,len(block)):
                      if block[j]=='[': depth+=1
                      elif block[j]==']':
                          depth-=1
                          if depth==0: end=j+1; break
                  if end is None: raise SystemExit('Unbalanced restriction')
                  out.append((start,end,block[start:end])); pos=end
              return out
          def remove_r(parts,byname,cls,required):
              i=byname[cls]; block=parts[i]
              matches=[x for x in restriction_spans(block) if all(k in x[2] for k in required)]
              if len(matches)!=1: raise SystemExit(f'{cls}: expected one {required}, got {len(matches)}')
              start,end,_=matches[0]
              m=re.match(r',\n\s*',block[end:])
              if m: block=block[:start]+block[end+m.end():]
              else:
                  pm=list(re.finditer(r',\n\s*$',block[:start]))
                  if not pm: raise SystemExit(f'{cls}: no safe separator')
                  block=block[:pm[-1].start()]+block[end:]
              parts[i]=block
          def replace_only(parts,byname,cls,prop,old,new):
              i=byname[cls]; block=parts[i]
              matches=[x for x in restriction_spans(block) if f'owl:onProperty edo:{prop}' in x[2] and f'owl:allValuesFrom edo:{old}' in x[2]]
              if len(matches)!=1: raise SystemExit(f'{cls}: expected one {prop} only {old}, got {len(matches)}')
              start,end,frag=matches[0]
              parts[i]=block[:start]+frag.replace(f'owl:allValuesFrom edo:{old}',f'owl:allValuesFrom edo:{new}')+block[end:]
          def sections(block):
              lines=block.splitlines(); header=[]; out=[]; cur=None
              for line in lines:
                  m=re.match(r'^    ([A-Za-z_][\w-]*:[\w-]+)\s+',line)
                  if m:
                      if cur: out.append(cur)
                      cur=[m.group(1),[line]]
                  else:
                      if cur: cur[1].append(line)
                      else: header.append(line)
              if cur: out.append(cur)
              return header,out
          def serialize(header,secs):
              for j,(_,ls) in enumerate(secs):
                  punct='.' if j==len(secs)-1 else ';'
                  ls[-1]=re.sub(r'\s*[;.](\s*)$',r'\1',ls[-1]).rstrip()+f' {punct}'
              return '\n'.join(header+[ln for _,ls in secs for ln in ls])
          def set_phase(parts,byname,name,phases):
              i=byname[name]; h,s=sections(parts[i]); s=[x for x in s if x[0]!='edo:hasLifecycleCreationPhase']
              if phases:
                  vals=',\n        '.join(f'edo:{p}' for p in phases)
                  s.append(['edo:hasLifecycleCreationPhase',[f'    edo:hasLifecycleCreationPhase {vals}']])
              parts[i]=serialize(h,s)

          parts=split_blocks(text); byname=block_map(parts)
          targets=[
            ('Asset',['owl:onProperty edo:hasAttribute','owl:onClass edo:IsSpare','owl:qualifiedCardinality "1"']),
            ('Asset',['owl:onProperty edo:hasAttribute','owl:onClass edo:SerialNumber','owl:qualifiedCardinality "1"']),
            ('AnodeCollarSet',['owl:onProperty edo:hasAttribute','owl:onClass edo:MetallicStrandSpareQuantity','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeEnvelope',['owl:onProperty edo:hasAttribute','owl:onClass edo:RequiredRiserConfiguration','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:IdInUnifilarDiagram','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:SpecialRequirements','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:MaxLengthTolerance','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:ManufacturingNonConformities','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:AssemblyShouldObeyModelPolarity','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:PipeSectionApplication','owl:qualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasAttribute','owl:onClass edo:ManufacturingDate','owl:qualifiedCardinality "1"']),
            ('DesignOperatingCondition',['owl:onProperty edo:hasOperatingState','owl:someValuesFrom edo:DesignOperatingState']),
            ('SubseaOilField',['owl:onProperty edo:spatiallyContains','owl:someValuesFrom edo:FloatingProductionUnit']),
            ('SubseaWell',['owl:onProperty edo:serves','owl:someValuesFrom edo:FloatingProductionUnit']),
            ('SubseaWell',['owl:onProperty edo:hosts','owl:someValuesFrom edo:WetChristmasTree']),
            ('RiserBalcony',['owl:onProperty edo:hosts','owl:someValuesFrom edo:RiserSupport']),
            ('Process',['owl:onProperty edo:hasTask','owl:allValuesFrom edo:Task']),
            ('Task',['owl:onProperty edo:hasEvidence','owl:allValuesFrom edo:Evidence']),
            ('Task',['owl:onProperty edo:hasIssue','owl:allValuesFrom edo:Issue']),
            ('Task',['owl:onProperty edo:hasResponsibleAgent','owl:allValuesFrom edo:Agent']),
            ('ConnectionInterface',['owl:onProperty edo:hasInterfaceSpecification','owl:allValuesFrom edo:ConnectionInterfaceSpecification']),
            ('ElectricalJumper',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('ElectricalJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricalControlPort']),
            ('ElectricalJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('ElectricalPowerJumper',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('ElectricalPowerJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricalPowerPort']),
            ('ElectricalPowerJumperConnector',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:ElectricPort']),
            ('FiberOpticJumper',['owl:onProperty edo:hasConnectionPoint','owl:allValuesFrom edo:DataPort']),
            ('ConnectionInterface',['owl:onProperty edo:isEndInterfaceOf','owl:onClass edo:LinearEnd','owl:maxQualifiedCardinality "1"']),
            ('FunctionLineEnd',['owl:onProperty edo:isTerminatedBy','owl:onClass edo:DomainElement','owl:minQualifiedCardinality "1"']),
            ('TubingEnd',['owl:onProperty edo:isTerminatedBy','owl:onClass edo:TubingCoupling','owl:minQualifiedCardinality "1"']),
            ('FlexiblePipeSegment',['owl:onProperty edo:hasEnd','owl:onClass edo:FlexiblePipeSegmentEnd','owl:qualifiedCardinality "2"']),
            ('UmbilicalSegment',['owl:onProperty edo:hasEnd','owl:onClass edo:UmbilicalEnd','owl:qualifiedCardinality "2"']),
            ('ElectricalCable',['owl:onProperty edo:hasEnd','owl:onClass edo:ElectricalCableEnd','owl:qualifiedCardinality "2"']),
            ('ElectricalControlCable',['owl:onProperty edo:hasEnd','owl:onClass edo:ElectricalControlCableEnd','owl:qualifiedCardinality "2"']),
            ('ElectricalPowerCable',['owl:onProperty edo:hasEnd','owl:onClass edo:ElectricalPowerCableEnd','owl:qualifiedCardinality "2"']),
            ('OpticalFiberCable',['owl:onProperty edo:hasEnd','owl:onClass edo:OpticalFiberCableEnd','owl:qualifiedCardinality "2"']),
            ('Tubing',['owl:onProperty edo:hasEnd','owl:onClass edo:TubingEnd','owl:qualifiedCardinality "2"']),
            ('TubingCoupling',['owl:onProperty edo:hasConnectionPoint','owl:onClass edo:FluidPort','owl:minQualifiedCardinality "2"']),
            ('GalvanicConnection',['owl:onProperty edo:hasPart','owl:onClass edo:MetallicStrandSet','owl:minQualifiedCardinality "1"']),
            ('GalvanicConnection',['owl:onProperty edo:hasPart','owl:allValuesFrom edo:MetallicStrandSet']),
            ('FlexibleStructureLayer',['owl:onProperty edo:hasMaterialSpecification','owl:allValuesFrom edo:MaterialSpecification']),
            ('OpticalFiberCableEnd',['owl:onProperty edo:exposesInterface','owl:allValuesFrom edo:DataPort']),
          ]
          for cls,req in targets: remove_r(parts,byname,cls,req)

          replace_only(parts,byname,'ElectricalJumper','hasConnectionPoint','ElectricalControlPort','ElectricalControlConnectorPort')
          replace_only(parts,byname,'ElectricalPowerJumper','hasConnectionPoint','ElectricalPowerPort','ElectricalPowerConnectorPort')

          i=byname['FlexiblePipeSegment']; block=parts[i]
          matches=[x for x in restriction_spans(block) if 'owl:onProperty edo:hasPart' in x[2] and 'owl:unionOf' in x[2] and all(v in x[2] for v in ['edo:FlexiblePipeBody','edo:EndFitting','edo:LineAncillary'])]
          if len(matches)!=1: raise SystemExit(f'FlexiblePipeSegment part closure matches={len(matches)}')
          start,end,frag=matches[0]
          frag2=re.sub(r'\s+edo:LineAncillary\b','',frag,count=1)
          if frag2==frag: raise SystemExit('LineAncillary removal failed')
          parts[i]=block[:start]+frag2+block[end:]

          text=''.join(parts); P.write_text(text,encoding='utf-8')
          gmid=Graph().parse(P,format='turtle'); parts=split_blocks(text); byname=block_map(parts)

          # Exact 15 current P22 grouping roots identified by audit; DrawingDimensions is intentionally excluded.
          p22_roots=[
            'BendingStiffnessCurveAttribute','BendMomentVsShearForceCurveAttribute','DiffusionCurveAttribute',
            'EarlyLeakMaxPressTableAttribute','EarlyLeakNomPressTableAttribute','EModVsTempCurveAttribute',
            'CrushingFrictionCoefficientTighteningAttribute','InternalIncidentalPressureCurveAttribute',
            'LayingMinimumRadiusCurveAttribute','MaxDesignAbsIntPresCurveAttribute',
            'CrushingMaximumAllowableTensionAttribute','CrushingMaximumAllowableTighteningAttribute',
            'PermeabilityCurveAttribute','SolubilityCurveAttribute','StrandsTableAttribute'
          ]
          for n in p22_roots:
              if not any(gmid.triples((EDO[n],None,None))): raise SystemExit(f'Missing audited P22 root {n}')
          exempt=set(); frontier=[EDO[x] for x in p22_roots]
          while frontier:
              p=frontier.pop()
              if p in exempt: continue
              exempt.add(p)
              for c in gmid.subjects(RDFS.subClassOf,p):
                  if isinstance(c,URIRef): frontier.append(c)
          before_table={str(s).split('#')[-1]:sorted(str(o).split('#')[-1] for o in gmid.objects(s,EDO.hasLifecycleCreationPhase)) for s in exempt if any(gmid.objects(s,EDO.hasLifecycleCreationPhase))}
          Path('/tmp/lot4_p22_phases.txt').write_text(repr(before_table),encoding='utf-8')

          dattrs=set(); frontier=[EDO.DomainAttribute]
          while frontier:
              p=frontier.pop()
              for c in gmid.subjects(RDFS.subClassOf,p):
                  if isinstance(c,URIRef) and c not in dattrs: dattrs.add(c); frontier.append(c)

          positive={'SerialNumber':['Fabrication'],'ManufacturingDate':['Fabrication'],'ManufacturingNonConformities':['Fabrication'],'FatMaxPress':['Fabrication'],'FatNomPress':['Fabrication'],'InstalledWaterDepth':['Installation'],'InstalledLength':['Installation']}
          changes=[]
          for s in sorted(dattrs,key=str):
              n=str(s).split('#')[-1]
              if n not in byname: continue
              current=sorted(str(o).split('#')[-1] for o in gmid.objects(s,EDO.hasLifecycleCreationPhase))
              if s in exempt: desired=current
              elif n in positive: desired=positive[n]
              else:
                  desired=[p for p in current if p not in {'BasicDesign','DetailedDesign'}]
                  if n=='CertifiedMaxWaterDepth': desired=[p for p in desired if p!='Commissioning']
              if current!=sorted(desired):
                  set_phase(parts,byname,n,desired); changes.append((n,current,desired))
          P.write_text(''.join(parts),encoding='utf-8')
          print('restriction_removals',len(targets))
          print('phase_changes',len(changes))
          print('P22_protected_phase_subjects',len(before_table))
          print('phase_sample',changes[:25])
          PY
      - name: Verify cleanup gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          from rdflib import Graph, Namespace, RDF, RDFS, OWL, URIRef
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')
          def rs(c,p): return [r for r in g.objects(EDO[c],RDFS.subClassOf) if (r,OWL.onProperty,EDO[p]) in g]
          def some(c,p,f): return any((r,OWL.someValuesFrom,EDO[f]) in g for r in rs(c,p))
          def only(c,p,f): return any((r,OWL.allValuesFrom,EDO[f]) in g for r in rs(c,p))
          def q(c,p,f,pred,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,pred)) for r in rs(c,p))

          assert not q('Asset','hasAttribute','IsSpare',OWL.qualifiedCardinality,1)
          assert not q('Asset','hasAttribute','SerialNumber',OWL.qualifiedCardinality,1)
          assert not some('DesignOperatingCondition','hasOperatingState','DesignOperatingState')
          assert not some('SubseaOilField','spatiallyContains','FloatingProductionUnit')
          assert not some('SubseaWell','serves','FloatingProductionUnit')
          assert not some('SubseaWell','hosts','WetChristmasTree')
          assert not some('RiserBalcony','hosts','RiserSupport')
          assert not only('Process','hasTask','Task')
          assert not only('Task','hasEvidence','Evidence')
          assert not only('Task','hasIssue','Issue')
          assert not only('Task','hasResponsibleAgent','Agent')
          assert not only('ConnectionInterface','hasInterfaceSpecification','ConnectionInterfaceSpecification')
          assert not rs('ConnectionInterface','isEndInterfaceOf')
          assert not q('FunctionLineEnd','isTerminatedBy','DomainElement',OWL.minQualifiedCardinality,1)
          assert not q('TubingEnd','isTerminatedBy','TubingCoupling',OWL.minQualifiedCardinality,1)
          assert not q('TubingCoupling','hasConnectionPoint','FluidPort',OWL.minQualifiedCardinality,2)
          assert not q('GalvanicConnection','hasPart','MetallicStrandSet',OWL.minQualifiedCardinality,1)
          assert not only('GalvanicConnection','hasPart','MetallicStrandSet')
          assert not only('FlexibleStructureLayer','hasMaterialSpecification','MaterialSpecification')
          assert not only('OpticalFiberCableEnd','exposesInterface','DataPort')
          assert not only('FiberOpticJumper','hasConnectionPoint','DataPort')

          assert some('FlexiblePipeEnvelope','hasOperatingCondition','DesignOperatingCondition')
          assert some('FloatingProductionUnit','hasPart','RiserBalcony')
          assert some('WetChristmasTree','hasPart','ConnectionModule')
          assert q('Process','hasTask','Task',OWL.minQualifiedCardinality,1)
          assert q('ConnectionInterface','hasInterfaceSpecification','ConnectionInterfaceSpecification',OWL.qualifiedCardinality,1)
          assert q('ConnectionInterface','isInterfaceConnectedTo','ConnectionInterface',OWL.maxQualifiedCardinality,1)
          assert only('FiberOpticJumper','hasConnectionPoint','OpticalConnectorPort')
          assert only('ElectricalJumper','hasConnectionPoint','ElectricalControlConnectorPort')
          assert only('ElectricalPowerJumper','hasConnectionPoint','ElectricalPowerConnectorPort')
          assert q('LinearObject','hasEnd','LinearEnd',OWL.qualifiedCardinality,2)
          assert q('FunctionLine','hasEnd','FunctionLineEnd',OWL.qualifiedCardinality,2)
          assert q('FlexiblePipeBody','hasEnd','FlexiblePipeBodyEnd',OWL.qualifiedCardinality,2)
          assert q('FlexibleStructureLayer','hasMaterialSpecification','MaterialSpecification',OWL.qualifiedCardinality,1)
          assert only('OpticalFiberCableEnd','exposesInterface','OpticalPort')

          unions=[]
          for r in rs('FlexiblePipeSegment','hasPart'):
              for c in g.objects(r,OWL.allValuesFrom):
                  h=g.value(c,OWL.unionOf)
                  if h: unions.append(h)
          assert len(unions)==1
          head=unions[0]; vals=[]
          while head and head!=RDF.nil:
              vals.append(g.value(head,RDF.first)); head=g.value(head,RDF.rest)
          assert set(vals)=={EDO.FlexiblePipeBody,EDO.EndFitting},vals

          p22_roots=['BendingStiffnessCurveAttribute','BendMomentVsShearForceCurveAttribute','DiffusionCurveAttribute','EarlyLeakMaxPressTableAttribute','EarlyLeakNomPressTableAttribute','EModVsTempCurveAttribute','CrushingFrictionCoefficientTighteningAttribute','InternalIncidentalPressureCurveAttribute','LayingMinimumRadiusCurveAttribute','MaxDesignAbsIntPresCurveAttribute','CrushingMaximumAllowableTensionAttribute','CrushingMaximumAllowableTighteningAttribute','PermeabilityCurveAttribute','SolubilityCurveAttribute','StrandsTableAttribute']
          exempt=set(); frontier=[EDO[x] for x in p22_roots]
          while frontier:
              p=frontier.pop()
              if p in exempt: continue
              exempt.add(p)
              for c in g.subjects(RDFS.subClassOf,p):
                  if isinstance(c,URIRef): frontier.append(c)
          before=ast.literal_eval(Path('/tmp/lot4_p22_phases.txt').read_text(encoding='utf-8'))
          after={str(s).split('#')[-1]:sorted(str(o).split('#')[-1] for o in g.objects(s,EDO.hasLifecycleCreationPhase)) for s in exempt if any(g.objects(s,EDO.hasLifecycleCreationPhase))}
          assert before==after,'P22 protected phase set changed'
          bad=[(str(s).split('#')[-1],str(o).split('#')[-1]) for s,o in g.subject_objects(EDO.hasLifecycleCreationPhase) if str(o).split('#')[-1] in {'BasicDesign','DetailedDesign'} and s not in exempt]
          assert not bad,f'non-P22 Basic/Detail phases: {bad[:25]}'
          assert not list(g.objects(EDO.CertifiedMaxWaterDepth,EDO.hasLifecycleCreationPhase))
          for n in ['SerialNumber','ManufacturingDate','ManufacturingNonConformities','FatMaxPress','FatNomPress']:
              assert set(g.objects(EDO[n],EDO.hasLifecycleCreationPhase))=={EDO.Fabrication},n
          for n in ['InstalledWaterDepth','InstalledLength']:
              assert set(g.objects(EDO[n],EDO.hasLifecycleCreationPhase))=={EDO.Installation},n
          assert not any(str(p).startswith(str(EDO)) for p in g.subjects(RDF.type,OWL.FunctionalProperty))
          assert not any(str(p).startswith(str(EDO)) for p in g.subjects(RDF.type,OWL.InverseFunctionalProperty))
          print('triples',len(g))
          print('phase_assertions',sum(1 for _ in g.triples((None,EDO.hasLifecycleCreationPhase,None))))
          print('P22_protected_phase_subjects',len(after))
          print('Lot 4 cleanup gate OK')
          PY
          git diff --check
          git diff --stat
      - name: Commit verified cleanup and remove runners
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot4-owl-cleanup.yml .github/workflows/phase-a-lot4-owl-cleanup-v2.yml
          git add core/edo-object-relations.ttl
          git diff --cached --check
          git commit -m "Implement PT-03 OWL cleanup pass"
          git push origin HEAD:audit-evolution-phase-a-implementation
