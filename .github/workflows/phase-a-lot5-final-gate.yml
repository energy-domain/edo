name: Phase A Lot 5 final positive matrix gate

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Verify complete active positive matrix
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')
          def rs(c,p): return [r for r in g.objects(EDO[c],RDFS.subClassOf) if (r,OWL.onProperty,EDO[p]) in g]
          def exact(c,p,f,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.qualifiedCardinality)) for r in rs(c,p))
          def minq(c,p,f,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.minQualifiedCardinality)) for r in rs(c,p))
          def maxq(c,p,f,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.maxQualifiedCardinality)) for r in rs(c,p))
          def some(c,p,f): return any((r,OWL.someValuesFrom,EDO[f]) in g for r in rs(c,p))
          def only(c,p,f): return any((r,OWL.allValuesFrom,EDO[f]) in g for r in rs(c,p))
          def union_only(c,p,fillers):
              want={EDO[x] for x in fillers}
              for r in rs(c,p):
                  for u in g.objects(r,OWL.allValuesFrom):
                      h=g.value(u,OWL.unionOf)
                      if not h: continue
                      vals=[]
                      while h and h!=RDF.nil:
                          vals.append(g.value(h,RDF.first)); h=g.value(h,RDF.rest)
                      if set(vals)==want: return True
              return False

          checks=[]
          def add(label,ok): checks.append((label,ok))

          exacts=[
            ('Asset','hasAttribute','ManufacturingDate',1),
            ('AnchoringCollar','hasAttribute','ExternalDiameter',1),('AnchoringCollar','hasAttribute','ClampInternalDiameter',1),('AnchoringCollar','hasAttribute','SafeWorkingLoad',1),
            ('AnodeCollarSet','hasAttribute','AnodeCollarsQuantity',1),('AnodeCollarSet','hasAttribute','AnodeCollarsAxialSpacing',1),
            ('AntiWearSheath','hasAttribute','TapesQuantity',1),
            ('BuoyancyModule','hasAttribute','StartOfLifeFloatVolume',1),('BuoyancyModule','hasAttribute','StartOfLifeFloatDensity',1),('BuoyancyModule','hasAttribute','EndOfLifeFloatVolume',1),('BuoyancyModule','hasAttribute','EndOfLifeFloatDensity',1),
            ('CompositeMaterialSpecification','hasAttribute','CompositeLayerMaterialType',1),('CompositeMaterialSpecification','hasAttribute','RuptDefAlongFibers',1),('CompositeMaterialSpecification','hasAttribute','RuptDefPerpendFibers',1),('CompositeMaterialSpecification','hasAttribute','UltTensStrAlongFibers',1),('CompositeMaterialSpecification','hasAttribute','UltTensStrPerpendFibers',1),
            ('FlexiblePipeEnvelope','hasAttribute','RequiredMinWaterDepth',1),('FlexiblePipeEnvelope','hasAttribute','RequiredMaxWaterDepth',1),('FlexiblePipeEnvelope','hasAttribute','RequiredMinimumTemperature',1),('FlexiblePipeEnvelope','hasAttribute','RequiredMaximumTemperature',1),('FlexiblePipeEnvelope','hasAttribute','RequiredInternalDiameter',1),('FlexiblePipeEnvelope','hasAttribute','RequiredBoreType',1),('FlexiblePipeEnvelope','hasAttribute','RequiredDesignLife',1),('FlexiblePipeEnvelope','hasAttribute','RequiredService',1),('FlexiblePipeEnvelope','hasAttribute','RequiredPipeSectionApplication',1),
            ('FlexiblePipeSegment','hasAttribute','NominalLength',1),
            ('ConnectionInterface','hasInterfaceSpecification','ConnectionInterfaceSpecification',1),
            ('FlexiblePipeSegment','hasPart','FlexiblePipeBody',1),('FlexiblePipeSegment','hasPart','EndFitting',2),
            ('GalvanicConnection','connectsInterface','AnodeGalvanicConnectionPoint',1),('GalvanicConnection','connectsInterface','ProtectedStructureGalvanicConnectionPoint',1),
            ('ClampedJoint','connectsInterface','CollarClampingSurface',1),('ClampedJoint','connectsInterface','PipeClampingSurface',1),
            ('FlexiblePipeCrimpedJoint','connectsPoint','FlexiblePipeCrimpedConnection',1),('FlexiblePipeCrimpedJoint','connectsPoint','EndFittingCrimpedConnection',1),
            ('FlangedJoint','connectsPoint','FlangeConnection',2),('WeldedJoint','connectsPoint','WeldedConnection',2),
            ('AttachmentPoint','isAttachmentPointOf','DomainElement',1),('ConnectionInterface','isConnectionInterfaceOf','DomainElement',1),('ConnectionPoint','isConnectionPointOf','DomainElement',1),('LinearEnd','isEndOf','DomainElement',1),('ElectricalContact','isElectricalContactOf','ElectricPort',1),
            ('UTA','terminatesEnd','UmbilicalEnd',1),('FlexiblePipeSegmentEnd','isTerminatedBy','EndFitting',1),
            ('InstallationPoint','hasReferenceDatum','Feature',1),('InstallationPoint','hasLongitudinalDirectionReference','Feature',1),('InstallationPoint','hasAttribute','RequiredLongitudinalPosition',1),
            ('LinearObject','hasEnd','LinearEnd',2),('FunctionLine','hasEnd','FunctionLineEnd',2),('FlexiblePipeBody','hasEnd','FlexiblePipeBodyEnd',2),
            ('FunctionLineEnd','isConstituentEndOf','UmbilicalEnd',1),('TubingCoupling','hasConnectionPoint','FluidPort',2),
            ('FlexiblePipeBody','hasConnectionPoint','FlexiblePipeCrimpedConnection',2),('FlexiblePipeBody','hasTechnicalConfiguration','FlexiblePipeStructure',1),
            ('EndFitting','hasConnectionPoint','FlangeConnection',1),('EndFitting','hasConnectionPoint','EndFittingCrimpedConnection',1),
            ('FlowConnector','hasConnectionPoint','FlowConnectorMatingConnection',1),('ConnectionModule','hasConnectionPoint','ConnectionModuleMatingConnection',1),('Hub','hasConnectionPoint','HubMatingConnection',1),('HubBlockCap','hasConnectionPoint','HubBlockCapMatingConnection',1),('HubProtectionCap','hasConnectionPoint','HubProtectionCapMatingConnection',1),('HotStab','hasConnectionPoint','HotStabMatingConnection',1),('HotStabReceptacle','hasConnectionPoint','HotStabReceptacleMatingConnection',1),
            ('FlangeAdapter','hasConnectionPoint','FlangeConnection',2),
            ('BuoyancyModule','hasMountingPoint','MountingPoint',1),('HangOffCollar','hasMountingPoint','MountingPoint',1),('StopperCollar','hasMountingPoint','MountingPoint',1),('AnodeCollar','hasMountingPoint','MountingPoint',1),
            ('SplitCollar','hasConnectionInterface','CollarClampingSurface',1),('HangOffCollar','hasConnectionInterface','CollarClampingSurface',1),
            ('FlexibleStructureLayer','hasMaterialSpecification','MaterialSpecification',1),
            ('FlexiblePipeSegmentEnd','exposesInterface','FlangeConnection',1),('FlexiblePipeBodyEnd','exposesInterface','FlexiblePipeCrimpedConnection',1),
            ('ElectricalContact','hasAttribute','ContactIdentifier',1),('ElectricalContactSpecification','hasAttribute','ContactIdentifier',1),('ElectricalContactSpecification','isElectricalContactSpecificationOf','ElectricalConnectorSpecification',1),
          ]
          for x in exacts: add('exact '+str(x),exact(*x))

          mins=[
            ('Process','hasTask','Task',1),('PhysicalConnection','connectsInterface','ConnectionInterface',2),
            ('ConnectorizedElectricalCableEnd','isTerminatedBy','Connector',1),('ConnectorizedOpticalFiberCableEnd','isTerminatedBy','Connector',1),('SplicedElectricalCableEnd','isTerminatedBy','ElectricalSpliceBox',1),('SplicedOpticalFiberCableEnd','isTerminatedBy','OpticalSpliceBox',1),
            ('AnodeCollarSet','hasPart','AnodeCollar',1),('UmbilicalSegment','hasPart','FunctionLine',1),('UmbilicalEnd','hasConstituentEnd','FunctionLineEnd',1),('UmbilicalEnd','exposesServiceInterface','ConnectionInterface',1),('FunctionLineEnd','exposesInterface','ConnectionInterface',1),
            ('Connector','hasConnectionPoint','ConnectionPoint',2),('ElectricalSpliceBox','hasConnectionPoint','ElectricalSplicePort',2),('UTA','hasTerminalHardware','DomainElement',1),
            ('FlowConnector','hasConnectionPoint','FluidPort',2),('LineTermination','hasConnectionPoint','ConnectionPoint',2),('PipeTermination','hasConnectionPoint','FluidPort',2),('Valve','hasConnectionPoint','FluidPort',2),('OpticalSpliceBox','hasConnectionPoint','OpticalSplicePort',2),
            ('FlexibleStructure','hasOrderedPart','FlexibleStructureLayer',2),
          ]
          for x in mins: add('min '+str(x),minq(*x))

          maxs=[('ConnectionPoint','isConnectedTo','ConnectionPoint',1),('ConnectionInterface','isInterfaceConnectedTo','ConnectionInterface',1),('ElectricalContact','isDefinedByElectricalContactSpecification','ElectricalContactSpecification',1)]
          for x in maxs: add('max '+str(x),maxq(*x))

          somes=[('FlexiblePipeEnvelope','hasOperatingCondition','DesignOperatingCondition'),('CheckProcess','hasActivityTarget','DomainElement'),('WetChristmasTree','hasPart','ConnectionModule'),('FloatingProductionUnit','hasPart','RiserBalcony'),('RiserSupport','hasConnectionPoint','ConnectionPoint')]
          for x in somes: add('some '+str(x),some(*x))

          onlys=[
            ('FlowConnectorMatingConnection','isConnectedTo','HubMatingConnection'),('ConnectionModuleMatingConnection','isConnectedTo','HubMatingConnection'),('HubBlockCapMatingConnection','isConnectedTo','HubMatingConnection'),('HubProtectionCapMatingConnection','isConnectedTo','HubMatingConnection'),
            ('HotStabMatingConnection','isConnectedTo','HotStabReceptacleMatingConnection'),('HotStabReceptacleMatingConnection','isConnectedTo','HotStabMatingConnection'),('EndFittingCrimpedConnection','isConnectedTo','FlexiblePipeCrimpedConnection'),('FlexiblePipeCrimpedConnection','isConnectedTo','EndFittingCrimpedConnection'),('AnodeGalvanicConnectionPoint','isConnectedTo','ProtectedStructureGalvanicConnectionPoint'),('ProtectedStructureGalvanicConnectionPoint','isConnectedTo','AnodeGalvanicConnectionPoint'),('CollarClampingSurface','isInterfaceConnectedTo','PipeClampingSurface'),('PipeClampingSurface','isInterfaceConnectedTo','CollarClampingSurface'),('FlangeConnection','isConnectedTo','FlangeConnection'),('WeldedConnection','isConnectedTo','WeldedConnection'),
            ('ChainSegment','hasConnectionPoint','MechanicalConnectionPoint'),('RopeSegment','hasConnectionPoint','MechanicalConnectionPoint'),('PipeSegment','hasConnectionPoint','FluidPort'),('HydraulicJumper','hasConnectionPoint','FluidPort'),('HydraulicJumperConnector','hasConnectionPoint','FluidPort'),('PanelHydraulicConnector','hasConnectionPoint','FluidPort'),('PanelElectricalConnector','hasConnectionPoint','ElectricalConnectorPort'),('PanelOpticalConnector','hasConnectionPoint','OpticalConnectorPort'),('Jumper','hasConnectionPoint','Port'),('ElectricalJumper','hasConnectionPoint','ElectricalControlConnectorPort'),('ElectricalJumperConnector','hasConnectionPoint','ElectricalControlConnectorPort'),('ElectricalPowerJumper','hasConnectionPoint','ElectricalPowerConnectorPort'),('ElectricalPowerJumperConnector','hasConnectionPoint','ElectricalPowerConnectorPort'),('FiberOpticJumper','hasConnectionPoint','OpticalConnectorPort'),
            ('FlangedJoint','connectsPoint','FlangeConnection'),('WeldedJoint','connectsPoint','WeldedConnection'),('UTA','terminatesEnd','UmbilicalEnd'),('TubingCoupling','hasConnectionPoint','FluidPort'),('FlexiblePipeBody','hasEnd','FlexiblePipeBodyEnd'),('FlexiblePipeBody','hasConnectionPoint','FlexiblePipeCrimpedConnection'),('FlangeAdapter','hasConnectionPoint','FlangeConnection'),('OpticalSpliceBox','hasConnectionPoint','OpticalSplicePort'),('FlexibleStructure','hasOrderedPart','FlexibleStructureLayer'),
            ('FlexiblePipeSegmentEnd','exposesInterface','FlangeConnection'),('FlexiblePipeBodyEnd','exposesInterface','FlexiblePipeCrimpedConnection'),
            ('FunctionLineEnd','isEndOf','FunctionLine'),('ElectricalCableEnd','isEndOf','ElectricalCable'),('ElectricalControlCableEnd','isEndOf','ElectricalControlCable'),('ElectricalPowerCableEnd','isEndOf','ElectricalPowerCable'),('OpticalFiberCableEnd','isEndOf','OpticalFiberCable'),('TubingEnd','isEndOf','Tubing'),('UmbilicalEnd','isEndOf','UmbilicalSegment'),('PipeClampingSurface','isConnectionInterfaceOf','PipeSegment'),
          ]
          for x in onlys: add('only '+str(x),only(*x))

          unions=[
            ('HubMatingConnection','isConnectedTo',['FlowConnectorMatingConnection','ConnectionModuleMatingConnection','HubBlockCapMatingConnection','HubProtectionCapMatingConnection']),
            ('FlexiblePipeSegment','hasPart',['FlexiblePipeBody','EndFitting']),
            ('GalvanicConnection','connectsInterface',['AnodeGalvanicConnectionPoint','ProtectedStructureGalvanicConnectionPoint']),
            ('ClampedJoint','connectsInterface',['CollarClampingSurface','PipeClampingSurface']),
            ('FlexiblePipeCrimpedJoint','connectsPoint',['FlexiblePipeCrimpedConnection','EndFittingCrimpedConnection']),
            ('EndFitting','hasConnectionPoint',['FlangeConnection','EndFittingCrimpedConnection']),
          ]
          for c,p,f in unions: add('union '+c+' '+p,union_only(c,p,f))

          add('P73 hasInstalledAncillary exists',(EDO.hasInstalledAncillary,RDF.type,OWL.ObjectProperty) in g)
          add('P73 isInstalledAncillaryOf exists',(EDO.isInstalledAncillaryOf,RDF.type,OWL.ObjectProperty) in g)

          missing=[label for label,ok in checks if not ok]
          print('ACTIVE_CHECKS',len(checks),'PASS',len(checks)-len(missing),'FAIL',len(missing))
          for x in missing: print('FAIL',x)
          assert not missing
          # P83 is explicitly deferred: decision says cardinality applies when future class is implemented.
          assert not any(g.triples((EDO.OperationalReadinessState,None,None)))
          # Global characteristics remain forbidden.
          assert not any(str(p).startswith(str(EDO)) for p in g.subjects(RDF.type,OWL.FunctionalProperty))
          assert not any(str(p).startswith(str(EDO)) for p in g.subjects(RDF.type,OWL.InverseFunctionalProperty))
          print('P83_DEFERRED_OK')
          print('triples',len(g))
          PY
          git diff --check
      - name: Remove final gate runner
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot5-final-gate.yml
          git commit -m "Record Lot 5 final positive matrix gate"
          git push origin HEAD:audit-evolution-phase-a-implementation
