name: Phase A Lot 5 positive OWL delta

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Apply five approved positive deltas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          P=Path('core/edo-object-relations.ttl')
          text=P.read_text(encoding='utf-8')

          def split_blocks(s): return re.split(r'(\n{2,})',s)
          def subject_name(block):
              m=re.match(r'edo:([^\s]+)\s+a\s+',block); return m.group(1) if m else None
          def block_map(parts): return {subject_name(parts[i]):i for i in range(0,len(parts),2) if subject_name(parts[i])}

          def prepend_restriction(parts,m,cls,body):
              i=m[cls]; block=parts[i]
              marker='    rdfs:subClassOf '
              pos=block.find(marker)
              if pos<0: raise SystemExit(f'{cls}: no rdfs:subClassOf to extend')
              start=pos+len(marker)
              restriction='[ a owl:Restriction ;\n'+body+' ],\n        '
              parts[i]=block[:start]+restriction+block[start:]

          parts=split_blocks(text); m=block_map(parts)

          # P13 — universal ManufacturingDate at Asset level.
          prepend_restriction(parts,m,'Asset',
              '            owl:onClass edo:ManufacturingDate ;\n'
              '            owl:onProperty edo:hasAttribute ;\n'
              '            owl:qualifiedCardinality "1"^^xsd:nonNegativeInteger')

          # P79 — a finished flexible-pipe segment end is terminated by exactly one EndFitting.
          prepend_restriction(parts,m,'FlexiblePipeSegmentEnd',
              '            owl:onClass edo:EndFitting ;\n'
              '            owl:onProperty edo:isTerminatedBy ;\n'
              '            owl:qualifiedCardinality "1"^^xsd:nonNegativeInteger')

          # P81 — simple longitudinal positioning has exactly one direction reference.
          prepend_restriction(parts,m,'InstallationPoint',
              '            owl:onClass edo:Feature ;\n'
              '            owl:onProperty edo:hasLongitudinalDirectionReference ;\n'
              '            owl:qualifiedCardinality "1"^^xsd:nonNegativeInteger')

          text=''.join(parts)

          # P73 — non-mereological installation relation for detachable LineAncillary.
          if 'edo:hasInstalledAncillary a owl:ObjectProperty' in text or 'edo:isInstalledAncillaryOf a owl:ObjectProperty' in text:
              raise SystemExit('P73 properties unexpectedly already exist')
          text += '''

edo:hasInstalledAncillary a owl:ObjectProperty ;
    rdfs:label "Has Installed Ancillary"@en,
        "Tem Acessório Instalado"@pt-br ;
    dcterms:identifier "hasInstalledAncillary" ;
    skos:definition "Relates a hosting domain element to a line ancillary installed or supported on it without asserting that the ancillary is a constitutive part of the host."@en,
        "Relaciona um elemento hospedeiro do domínio a um acessório de linha nele instalado ou suportado sem afirmar que o acessório é parte constitutiva do hospedeiro."@pt-br ;
    rdfs:subPropertyOf edo:hosts ;
    rdfs:domain edo:DomainElement ;
    rdfs:range edo:LineAncillary ;
    owl:inverseOf edo:isInstalledAncillaryOf .

edo:isInstalledAncillaryOf a owl:ObjectProperty ;
    rdfs:label "Is Installed Ancillary Of"@en,
        "É Acessório Instalado De"@pt-br ;
    dcterms:identifier "isInstalledAncillaryOf" ;
    skos:definition "Relates a line ancillary to the domain element on which it is installed or supported without asserting constitutive parthood."@en,
        "Relaciona um acessório de linha ao elemento do domínio no qual ele está instalado ou suportado sem afirmar composição constitutiva."@pt-br ;
    rdfs:subPropertyOf edo:isHostedBy ;
    rdfs:domain edo:LineAncillary ;
    rdfs:range edo:DomainElement ;
    owl:inverseOf edo:hasInstalledAncillary .
'''
          P.write_text(text,encoding='utf-8')
          print('Applied P13 + P73 pair + P79 + P81')
          PY
      - name: Verify active Lot 5 delta and corrected P75 semantics
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')
          def rs(c,p): return [r for r in g.objects(EDO[c],RDFS.subClassOf) if (r,OWL.onProperty,EDO[p]) in g]
          def exact(c,p,f,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.qualifiedCardinality)) for r in rs(c,p))
          def union_only(c,p,fillers):
              want={EDO[x] for x in fillers}
              for r in rs(c,p):
                  for u in g.objects(r,OWL.allValuesFrom):
                      h=g.value(u,OWL.unionOf)
                      if not h: continue
                      vals=[]
                      while h and h!=RDF.nil:
                          vals.append(g.value(h,RDF.first)); h=g.value(h,RDF.rest)
                      if set(vals)==want: return True
              return False

          # Five actual delta items.
          assert exact('Asset','hasAttribute','ManufacturingDate',1)
          assert exact('FlexiblePipeSegmentEnd','isTerminatedBy','EndFitting',1)
          assert exact('InstallationPoint','hasLongitudinalDirectionReference','Feature',1)
          assert (EDO.hasInstalledAncillary,RDF.type,OWL.ObjectProperty) in g
          assert (EDO.isInstalledAncillaryOf,RDF.type,OWL.ObjectProperty) in g
          assert (EDO.hasInstalledAncillary,RDFS.subPropertyOf,EDO.hosts) in g
          assert (EDO.isInstalledAncillaryOf,RDFS.subPropertyOf,EDO.isHostedBy) in g
          assert (EDO.hasInstalledAncillary,RDFS.domain,EDO.DomainElement) in g
          assert (EDO.hasInstalledAncillary,RDFS.range,EDO.LineAncillary) in g
          assert (EDO.isInstalledAncillaryOf,RDFS.domain,EDO.LineAncillary) in g
          assert (EDO.isInstalledAncillaryOf,RDFS.range,EDO.DomainElement) in g
          assert (EDO.hasInstalledAncillary,OWL.inverseOf,EDO.isInstalledAncillaryOf) in g
          assert (EDO.hasInstalledAncillary,RDFS.subPropertyOf,EDO.hasPart) not in g
          assert (EDO.isInstalledAncillaryOf,RDFS.subPropertyOf,EDO.isPartOf) not in g

          # Corrected P75: current model uses connectsInterface for these participants.
          for c,f in [('GalvanicConnection','AnodeGalvanicConnectionPoint'),('GalvanicConnection','ProtectedStructureGalvanicConnectionPoint'),('ClampedJoint','CollarClampingSurface'),('ClampedJoint','PipeClampingSurface')]:
              assert exact(c,'connectsInterface',f,1),(c,f)
          assert union_only('GalvanicConnection','connectsInterface',['AnodeGalvanicConnectionPoint','ProtectedStructureGalvanicConnectionPoint'])
          assert union_only('ClampedJoint','connectsInterface',['CollarClampingSurface','PipeClampingSurface'])

          # P83 explicitly remains future/deferred because the class is absent.
          assert not any(g.triples((EDO.OperationalReadinessState,None,None)))

          # No global functionalization introduced.
          assert not any(str(p).startswith(str(EDO)) for p in g.subjects(RDF.type,OWL.FunctionalProperty))
          assert not any(str(p).startswith(str(EDO)) for p in g.subjects(RDF.type,OWL.InverseFunctionalProperty))
          print('triples',len(g))
          print('five active deltas OK')
          print('P75 corrected semantics OK')
          print('P83 deferred/absent OK')
          PY
          git diff --check
          git diff --stat
      - name: Commit verified Lot 5 delta and remove runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot5-positive-delta.yml
          git add core/edo-object-relations.ttl
          git diff --cached --check
          git commit -m "Implement PT-03 positive OWL cardinality delta"
          git push origin HEAD:audit-evolution-phase-a-implementation
