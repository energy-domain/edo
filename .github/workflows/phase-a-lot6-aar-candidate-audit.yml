name: Phase A Lot 6 AAR candidate audit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Build minimal AAR candidate set
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')
          def local(u): return str(u).split('#')[-1]
          def descendants_of(node,root):
              if node==root:return True
              seen=set(); stack=[node]
              while stack:
                  cur=stack.pop()
                  for p in g.objects(cur,RDFS.subClassOf):
                      if not str(p).startswith(str(EDO)): continue
                      if p==root:return True
                      if p not in seen: seen.add(p); stack.append(p)
              return False
          def named_ancestors(c):
              out=set(); stack=[c]
              while stack:
                  cur=stack.pop()
                  for p in g.objects(cur,RDFS.subClassOf):
                      if not str(p).startswith(str(EDO)): continue
                      if p not in out: out.add(p); stack.append(p)
              return out

          # Direct named hasAttribute pairs in current model.
          current=set()
          for c,r in g.subject_objects(RDFS.subClassOf):
              if not str(c).startswith(str(EDO)) or (r,OWL.onProperty,EDO.hasAttribute) not in g: continue
              fs=set(g.objects(r,OWL.onClass))|set(g.objects(r,OWL.someValuesFrom))|set(g.objects(r,OWL.allValuesFrom))
              for f in fs:
                  if str(f).startswith(str(EDO)): current.add((local(c),local(f)))

          prefixes={
            'BendRestrictor':['BendMomentVsShearForceTable_'],
            'FlexiblePipeSegment':['EarlyLeakMaxPressTable_','EarlyLeakNomPressTable_'],
            'FlexiblePipeStructure':['BendingMomentTable_','FrictionCoefficientTighteningTable_','LayingMinimumRadiusTable_','MaximumAllowableTensionTable_','MaximumAllowableTighteningTable_'],
            'PolymericMaterialSpecification':['DiffusionTable_','EModVsTempTable_','PermeabilityTable_','SolubilityTable_'],
            'SubseaPipeline':['InternalIncidentalPressureTable_','MaxDesignAbsIntPresTable_'],
            'MetallicStrandSet':['StrandsTable_'],
          }
          params={
            'FlexiblePipeStructure':{'AbsoluteInsidePressure','AbsoluteOutsidePressure','CriticalCurvatureOfSlipping','InsideTemperature','OutsideTemperature','IntermediateValuesStrategy','PreSlippingBendingStiffness','PostSlippingBendingStiffness','TensileArmourAnnulusCondition','TestConditions','MaximumAmbientTemperature','TensionerPadsMaterial','TensionerPadsOpeningAngle','TensionerPadsShape','TensionerTracksQuantity','UtilizationFactor','DimensioningCriteria'},
            'FlexiblePipeSegment':{'IntermediateValuesStrategy'},
          }
          p22={(c,a) for c,a in current if any(a.startswith(p) for p in prefixes.get(c,())) or a in params.get(c,set())}

          # Explicitly preserved applicability whose OWL cardinality/restriction was removed or promoted.
          explicit_added={
            ('Asset','IsSpare'),
            ('Asset','SerialNumber'),
            ('AnodeCollarSet','MetallicStrandSpareQuantity'),
            ('FlexiblePipeSegment','AssemblyShouldObeyModelPolarity'),
            ('FlexiblePipeSegment','IdInSingleLineDiagram'),
            ('FlexiblePipeSegment','ManufacturingNonConformities'),
            ('FlexiblePipeSegment','PipeSectionApplication'),
          }
          # Context-dependent or unresolved subjects: deliberately no generic AAR in this pass.
          deferred_special={
            ('FlexiblePipeEnvelope','RequiredRiserConfiguration'),
            ('FlexiblePipeSegment','MaxLengthTolerance'),
            ('HardwareItem','IdInSingleLineDiagram'), # B-PT03-019: do not ratify by new rule before review
          }
          candidates=(current-p22-deferred_special)|explicit_added

          # Validate pair typing before any generation.
          bad=[]
          for c,a in sorted(candidates):
              cu,au=EDO[c],EDO[a]
              if (cu,RDF.type,OWL.Class) not in g or not descendants_of(cu,EDO.DomainElement): bad.append((c,a,'element target not DomainElement class'))
              if (au,RDF.type,OWL.Class) not in g or not descendants_of(au,EDO.DomainAttribute): bad.append((c,a,'attribute target not DomainAttribute class'))
          print('CURRENT',len(current),'P22',len(p22),'EXPLICIT_ADDED',len(explicit_added),'SPECIAL_DEFERRED',len(deferred_special),'CANDIDATES',len(candidates),'BAD',len(bad))
          for x in bad: print('BAD',*x)
          assert not bad

          # Minimize via AAR inheritance: an ancestor candidate for the same attribute covers descendants.
          roots=set(); inherited=[]
          candidate_uris={(EDO[c],EDO[a]) for c,a in candidates}
          for c,a in sorted(candidates):
              ancestors=named_ancestors(EDO[c])
              covering=sorted(local(x) for x in ancestors if (x,EDO[a]) in candidate_uris)
              if covering:
                  inherited.append((c,a,covering))
              else:
                  roots.add((c,a))

          # P11 contextual specializations are intentionally added even though inherited from Asset.
          contextual_specializations={
            ('EndFitting','IsSpare','Asset','IsSpare','Procurement'),
            ('Equipment','IsSpare','Asset','IsSpare','Installation'),
          }
          print('MINIMAL_ROOT_AARS',len(roots),'INHERITED_NO_RULE',len(inherited),'CONTEXT_SPECIALIZATIONS',len(contextual_specializations))
          print('\nROOTS')
          for x in sorted(roots): print('ROOT',*x)
          print('\nINHERITED')
          for c,a,cov in inherited: print('INHERITED',c,a,'BY',','.join(cov))
          print('\nSPECIALIZATIONS')
          for x in sorted(contextual_specializations): print('SPECIAL',*x)
          print('\nDEFERRED_SPECIAL')
          for x in sorted(deferred_special): print('DEFER',*x)
          print('\nP22_COUNT',len(p22))
          assert ('Asset','IsSpare') in roots
          assert ('Asset','SerialNumber') in roots
          assert ('FlexiblePipeSegment','IdInSingleLineDiagram') in roots
          assert ('HardwareItem','IdInSingleLineDiagram') not in candidates
          PY
      - name: Remove audit runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot6-aar-candidate-audit.yml
          git commit -m "Record Lot 6 AAR candidate audit"
          git push origin HEAD:audit-evolution-phase-a-implementation
