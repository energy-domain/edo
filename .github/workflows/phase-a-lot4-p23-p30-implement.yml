name: Phase A Lot 4 P23 P30 implementation

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Implement P23 and P30 in target TTL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          P=Path('core/edo-object-relations.ttl')
          text=P.read_text(encoding='utf-8')

          expected={
            'NominalFloatVolume':3,'NominalFloatDensity':3,
            'ShortTermFloatVolume':3,'ShortTermFloatDensity':3,
            'LongTermFloatVolume':3,'LongTermFloatDensity':3,
            'IdInUnifilarDiagram':3,'SpecialRequirements':2,
          }
          for term,n in expected.items():
              got=text.count(term)
              if got!=n: raise SystemExit(f'{term}: expected {n} occurrences in target TTL, got {got}')

          def split_blocks(s): return re.split(r'(\n{2,})',s)
          def subject_name(block):
              m=re.match(r'edo:([^\s]+)\s+a\s+',block); return m.group(1) if m else None
          def byname(parts): return {subject_name(parts[i]):i for i in range(0,len(parts),2) if subject_name(parts[i])}
          def restriction_spans(block):
              out=[]; pos=0; needle='[ a owl:Restriction ;'
              while True:
                  start=block.find(needle,pos)
                  if start<0: break
                  depth=0; end=None
                  for j in range(start,len(block)):
                      if block[j]=='[': depth+=1
                      elif block[j]==']':
                          depth-=1
                          if depth==0: end=j+1; break
                  if end is None: raise SystemExit('unbalanced restriction')
                  out.append((start,end,block[start:end])); pos=end
              return out
          def remove_restriction(parts,m,cls,required):
              i=m[cls]; block=parts[i]
              hits=[x for x in restriction_spans(block) if all(k in x[2] for k in required)]
              if len(hits)!=1: raise SystemExit(f'{cls}: expected one restriction {required}, got {len(hits)}')
              start,end,_=hits[0]
              f=re.match(r',\n\s*',block[end:])
              if f: parts[i]=block[:start]+block[end+f.end():]
              else:
                  ps=list(re.finditer(r',\n\s*$',block[:start]))
                  if not ps: raise SystemExit(f'{cls}: no safe separator')
                  parts[i]=block[:ps[-1].start()]+block[end:]
          def remove_subject(parts,m,name):
              parts[m[name]]=''

          parts=split_blocks(text); m=byname(parts)
          remove_restriction(parts,m,'BuoyancyModule',['owl:onClass edo:NominalFloatVolume','owl:onProperty edo:hasAttribute','owl:qualifiedCardinality "1"'])
          remove_restriction(parts,m,'BuoyancyModule',['owl:onClass edo:NominalFloatDensity','owl:onProperty edo:hasAttribute','owl:qualifiedCardinality "1"'])
          remove_subject(parts,m,'NominalFloatVolume')
          remove_subject(parts,m,'NominalFloatDensity')

          text=''.join(parts)
          rename={
            'ShortTermFloatVolume':'StartOfLifeFloatVolume',
            'ShortTermFloatDensity':'StartOfLifeFloatDensity',
            'LongTermFloatVolume':'EndOfLifeFloatVolume',
            'LongTermFloatDensity':'EndOfLifeFloatDensity',
            'IdInUnifilarDiagram':'IdInSingleLineDiagram',
          }
          for old,new in rename.items(): text=text.replace(old,new)

          parts=split_blocks(text); m=byname(parts)
          remove_subject(parts,m,'SpecialRequirements')
          text=''.join(parts)
          parts=split_blocks(text); m=byname(parts)

          def set_predicate_block(name,pred,lines):
              i=m[name]; block=parts[i]; ls=block.splitlines(); header=[]; secs=[]; cur=None
              for line in ls:
                  mm=re.match(r'^    ([A-Za-z_][\w-]*:[\w-]+)\s+',line)
                  if mm:
                      if cur: secs.append(cur)
                      cur=[mm.group(1),[line]]
                  else:
                      if cur: cur[1].append(line)
                      else: header.append(line)
              if cur: secs.append(cur)
              secs=[s for s in secs if s[0]!=pred]
              secs.append([pred,lines])
              for j,(_,sl) in enumerate(secs):
                  punct='.' if j==len(secs)-1 else ';'
                  sl[-1]=re.sub(r'\s*[;.](\s*)$',r'\1',sl[-1]).rstrip()+f' {punct}'
              parts[i]='\n'.join(header+[x for _,sl in secs for x in sl])

          set_predicate_block('StartOfLifeFloatVolume','skos:prefLabel',[
            '    skos:prefLabel "Start of Life Float Volume"@en,',
            '        "Volume de Flutuação no Início da Vida"@pt-br'])
          set_predicate_block('StartOfLifeFloatVolume','skos:definition',[
            '    skos:definition "Displaced volume of the buoyancy module at SOL — Start of Life, representing its beginning-of-life buoyancy condition."@en,',
            '        "Volume deslocado do módulo de flutuação em SOL — Start of Life (início da vida), representando sua condição de flutuabilidade no início da vida."@pt-br'])
          set_predicate_block('StartOfLifeFloatDensity','skos:prefLabel',[
            '    skos:prefLabel "Start of Life Float Density"@en,',
            '        "Densidade de Flutuação no Início da Vida"@pt-br'])
          set_predicate_block('StartOfLifeFloatDensity','skos:definition',[
            '    skos:definition "Density characteristic of the buoyancy module at SOL — Start of Life, representing its beginning-of-life buoyancy condition."@en,',
            '        "Característica de densidade do módulo de flutuação em SOL — Start of Life (início da vida), representando sua condição de flutuabilidade no início da vida."@pt-br'])
          set_predicate_block('EndOfLifeFloatVolume','skos:prefLabel',[
            '    skos:prefLabel "End of Life Float Volume"@en,',
            '        "Volume de Flutuação no Fim da Vida"@pt-br'])
          set_predicate_block('EndOfLifeFloatVolume','skos:definition',[
            '    skos:definition "Displaced volume of the buoyancy module at EOL — End of Life, representing its end-of-life buoyancy condition after lifecycle effects."@en,',
            '        "Volume deslocado do módulo de flutuação em EOL — End of Life (fim da vida), representando sua condição de flutuabilidade no fim da vida após os efeitos do ciclo de vida."@pt-br'])
          set_predicate_block('EndOfLifeFloatDensity','skos:prefLabel',[
            '    skos:prefLabel "End of Life Float Density"@en,',
            '        "Densidade de Flutuação no Fim da Vida"@pt-br'])
          set_predicate_block('EndOfLifeFloatDensity','skos:definition',[
            '    skos:definition "Density characteristic of the buoyancy module at EOL — End of Life, representing its end-of-life buoyancy condition after lifecycle effects."@en,',
            '        "Característica de densidade do módulo de flutuação em EOL — End of Life (fim da vida), representando sua condição de flutuabilidade no fim da vida após os efeitos do ciclo de vida."@pt-br'])
          set_predicate_block('IdInSingleLineDiagram','skos:prefLabel',[
            '    skos:prefLabel "ID in Single-Line Diagram"@en,',
            '        "Identificador no Diagrama Unifilar"@pt-br'])
          set_predicate_block('IdInSingleLineDiagram','skos:definition',[
            '    skos:definition "Identifier assigned to the item in a single-line diagram, used to reference that item within the diagram."@en,',
            '        "Identificador atribuído ao item em um diagrama unifilar, usado para referenciar esse item no próprio diagrama."@pt-br'])

          P.write_text(''.join(parts),encoding='utf-8')
          print('P23/P30 target transformation written')
          PY
      - name: Verify P23 P30 gate
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDFS, OWL, Literal
          from pathlib import Path
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          SKOS=Namespace('http://www.w3.org/2004/02/skos/core#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')
          text=Path('core/edo-object-relations.ttl').read_text(encoding='utf-8')
          old=['NominalFloatVolume','NominalFloatDensity','ShortTermFloatVolume','ShortTermFloatDensity','LongTermFloatVolume','LongTermFloatDensity','IdInUnifilarDiagram','SpecialRequirements']
          for n in old: assert n not in text,(n,'residual in target TTL')
          new=['StartOfLifeFloatVolume','StartOfLifeFloatDensity','EndOfLifeFloatVolume','EndOfLifeFloatDensity','IdInSingleLineDiagram']
          for n in new: assert any(g.triples((EDO[n],None,None))),(n,'missing new class')
          def q(c,p,f,n):
              for r in g.objects(EDO[c],RDFS.subClassOf):
                  if (r,OWL.onProperty,EDO[p]) in g and (r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.qualifiedCardinality)): return True
              return False
          for a in ['StartOfLifeFloatVolume','StartOfLifeFloatDensity','EndOfLifeFloatVolume','EndOfLifeFloatDensity']:
              assert q('BuoyancyModule','hasAttribute',a,1),a
          assert sum(1 for r in g.objects(EDO.BuoyancyModule,RDFS.subClassOf) if (r,OWL.onProperty,EDO.hasAttribute) in g and any((r,OWL.onClass,EDO[a]) in g for a in ['StartOfLifeFloatVolume','StartOfLifeFloatDensity','EndOfLifeFloatVolume','EndOfLifeFloatDensity']))==4
          for n,token in [('StartOfLifeFloatVolume','SOL'),('StartOfLifeFloatDensity','SOL'),('EndOfLifeFloatVolume','EOL'),('EndOfLifeFloatDensity','EOL')]:
              defs=' '.join(str(x) for x in g.objects(EDO[n],SKOS.definition)); assert token in defs,(n,token)
              assert not list(g.objects(EDO[n],EDO.hasLifecycleCreationPhase)),(n,'phase')
          assert Literal('ID in Single-Line Diagram',lang='en') in set(g.objects(EDO.IdInSingleLineDiagram,SKOS.prefLabel))
          assert Literal('Identificador no Diagrama Unifilar',lang='pt-br') in set(g.objects(EDO.IdInSingleLineDiagram,SKOS.prefLabel))
          assert Literal('Identifier assigned to the item in a single-line diagram, used to reference that item within the diagram.',lang='en') in set(g.objects(EDO.IdInSingleLineDiagram,SKOS.definition))
          assert Literal('Identificador atribuído ao item em um diagrama unifilar, usado para referenciar esse item no próprio diagrama.',lang='pt-br') in set(g.objects(EDO.IdInSingleLineDiagram,SKOS.definition))
          assert q('HardwareItem','hasAttribute','IdInSingleLineDiagram',1),'HardwareItem cardinality changed incidentally'
          assert not q('FlexiblePipeSegment','hasAttribute','IdInSingleLineDiagram',1)
          print('triples',len(g))
          print('P23 P30 gate OK')
          PY
          git diff --check
          git diff --stat
      - name: Commit verified P23 P30 implementation and remove runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot4-p23-p30-implement.yml
          git add core/edo-object-relations.ttl
          git diff --cached --check
          git commit -m "Complete PT-03 Lot 4 target cleanup"
          git push origin HEAD:audit-evolution-phase-a-implementation
