name: Phase A Lot 4 OWL cleanup audit

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit-evolution-phase-a-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Print cleanup-candidate restrictions
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')
          classes=['Asset','DesignOperatingCondition','SubseaOilField','FloatingProductionUnit','SubseaWell','WCT','RiserBalcony','Process','Task','ConnectionInterface','FiberOpticJumper','OpticalFiberCableEnd','GalvanicConnection','FunctionLineEnd','TubingEnd','FlexibleStructureLayer','LinearObject','FunctionLine','FlexiblePipeSegment','UmbilicalSegment','UmbilicalEnd']
          preds=[(OWL.someValuesFrom,'some'),(OWL.allValuesFrom,'only'),(OWL.hasValue,'value'),(OWL.onClass,'onClass'),(OWL.qualifiedCardinality,'exact'),(OWL.minQualifiedCardinality,'min'),(OWL.maxQualifiedCardinality,'max')]
          for c in classes:
              print('\nCLASS',c)
              for r in g.objects(EDO[c],RDFS.subClassOf):
                  if (r,RDF.type,OWL.Restriction) not in g: continue
                  prop=g.value(r,OWL.onProperty)
                  d=[]
                  for p,l in preds:
                      vals=list(g.objects(r,p))
                      if vals:d.append((l,[str(v).split('#')[-1] for v in vals]))
                  print(' ',str(prop).split('#')[-1] if prop else None,d)
          # Lifecycle creation phase annotations currently asserted on attribute classes.
          phase=EDO.hasLifecycleCreationPhase
          vals=[]
          for s,o in g.subject_objects(phase): vals.append((str(s).split('#')[-1],str(o).split('#')[-1]))
          print('\nLIFECYCLE_CREATION_PHASE_COUNT',len(vals))
          from collections import Counter
          print('PHASE_COUNTS',Counter(v for _,v in vals))
          print('PHASE_SAMPLE',sorted(vals)[:80])
          PY
      - name: Remove audit runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot4-audit.yml
          git commit -m "Record Lot 4 OWL cleanup audit checkpoint"
          git push origin HEAD:audit-evolution-phase-a-implementation
