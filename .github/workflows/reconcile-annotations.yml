name: Temporary EDO annotation reconciliation

on:
  push:
    branches:
      - reconcile-edo-develop-annotations
    paths:
      - tools/reconcile_annotations.py
      - tools/validate_annotation_reconciliation.py
      - .github/workflows/reconcile-annotations.yml

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PINNED_MAIN: 85b7ac4fea18efd1061548a76364e821946f13a3
      TARGET_CORE: core/energy-domain-ontology.ttl
      EDO_IFC: mappings/ifc/edo-ifc.ttl
      SOURCE_CORE: /tmp/pinned-edo.ttl
      BASELINE_CORE: /tmp/baseline-develop.ttl
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: reconcile-edo-develop-annotations

      - name: Load frozen baseline and pinned normative sources
        shell: bash
        run: |
          set -euo pipefail
          cp "${TARGET_CORE}" "${BASELINE_CORE}"
          git fetch origin "${PINNED_MAIN}"
          git show "${PINNED_MAIN}:core/edo.ttl" > "${SOURCE_CORE}"
          mkdir -p mappings/ifc
          git show "${PINNED_MAIN}:mappings/ifc/edo-ifc.ttl" > "${EDO_IFC}"

      - name: Install Turtle validator
        run: python -m pip install --disable-pip-version-check rdflib

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit 1 - extend controlled IFC vocabulary
        run: |
          set -euo pipefail
          python tools/reconcile_annotations.py extend-ifc --source-core "${SOURCE_CORE}" --target-core "${TARGET_CORE}" --edo-ifc "${EDO_IFC}"
          git add "${EDO_IFC}"
          git diff --cached --check
          git commit -m "Extend controlled IFC vocabulary for develop mappings"

      - name: Commit 2 - replace and add normative annotation taxonomy
        run: |
          set -euo pipefail
          python tools/reconcile_annotations.py taxonomy --source-core "${SOURCE_CORE}" --target-core "${TARGET_CORE}" --edo-ifc "${EDO_IFC}"
          git add "${TARGET_CORE}"
          git diff --cached --check
          git commit -m "Reconcile develop annotation taxonomy with current EDO"

      - name: Commit 3 - create legacy compatibility branch
        run: |
          set -euo pipefail
          python tools/reconcile_annotations.py legacy --source-core "${SOURCE_CORE}" --target-core "${TARGET_CORE}" --edo-ifc "${EDO_IFC}"
          git add "${TARGET_CORE}"
          git diff --cached --check
          git commit -m "Add explicit legacy annotation compatibility branch"

      - name: Commit 4 - fix hasAtrribute typo
        run: |
          set -euo pipefail
          python tools/reconcile_annotations.py typo --source-core "${SOURCE_CORE}" --target-core "${TARGET_CORE}" --edo-ifc "${EDO_IFC}"
          git add "${TARGET_CORE}"
          git diff --cached --check
          git commit -m "Fix legacy hasAtrribute typo"

      - name: Commit 5 - migrate IFC annotation usages
        run: |
          set -euo pipefail
          python tools/reconcile_annotations.py ifc --source-core "${SOURCE_CORE}" --target-core "${TARGET_CORE}" --edo-ifc "${EDO_IFC}"
          git add "${TARGET_CORE}"
          git diff --cached --check
          git commit -m "Migrate develop IFC annotations to EDO-IFC vocabulary"

      - name: Validate final Turtle and baseline invariants
        run: |
          set -euo pipefail
          python tools/validate_annotation_reconciliation.py \
            --baseline-core "${BASELINE_CORE}" \
            --source-core "${SOURCE_CORE}" \
            --target-core "${TARGET_CORE}" \
            --edo-ifc "${EDO_IFC}"
          git diff --check "${GITHUB_SHA}..HEAD"

      - name: Push validated commits
        run: git push origin HEAD:reconcile-edo-develop-annotations
