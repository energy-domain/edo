name: Phase A Lot 2 PT-02 relation taxonomy

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'audit-evolution-phase-a-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0

      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4

      - name: Apply PT-02 P52/P53 taxonomy and structural metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          P = Path('core/edo-object-relations.ttl')
          text = P.read_text(encoding='utf-8')
          parts = re.split(r'(\n{2,})', text)

          family_defs = {
              'ClassificationRelation': ('DomainRelation', 'Relates a domain element to an external reference or controlled concept used to classify it.'),
              'CompatibilityRelation': ('DomainRelation', 'Expresses compatibility or relational aptitude without asserting that a connection is realized.'),
              'ParticipationRelation': ('DomainRelation', 'Expresses semantically qualified participation of a domain element in an activity.'),
              'OutcomeRelation': ('DomainRelation', 'Relates an activity to an identifiable outcome and its inverse.'),
              'TargetRelation': ('DomainRelation', 'Relates an activity or activity outcome to the domain element that is its target.'),
              'StateRelation': ('DomainRelation', 'Relates a state occurrence to the domain element that bears that state.'),
              'AboutnessRelation': ('DomainRelation', 'Relates an information artifact or issue to the domain element it is about.'),
              'EvidenceRelation': ('DomainRelation', 'Relates a domain element to identifiable evidence supporting or demonstrating information about it.'),
              'IssueTrackingRelation': ('DomainRelation', 'Relates an activity to an issue tracked in that activity.'),
              'FeatureDependenceRelation': ('DomainRelation', 'Relates a dependent feature to the domain element that carries it.'),
              'MembershipRelation': ('DomainRelation', 'Expresses membership in an identifiable grouping without implying part-whole structure.'),
              'ResponsibilityRelation': ('DomainRelation', 'Relates a domain element to an agent assigned responsibility for it.'),
              'InterfaceExposureRelation': ('SpatialRelation', 'Relates a linear end to a connection interface exposed at that end without asserting feature ownership.'),
          }

          # parents, domain, range, inverse, definition (new terms only)
          specs = {
              'hasAttribute': (['AttributeRelation'], 'DomainElement', 'DomainAttribute', None, None),
              'hasPart': (['PartWholeRelation'], 'DomainElement', 'DomainElement', 'isPartOf', None),
              'isPartOf': (['PartWholeRelation'], 'DomainElement', 'DomainElement', 'hasPart', 'Relates a part to the domain element of which it is a part.'),
              'hasTask': (['hasPart'], 'Process', 'Task', None, None),
              'hasOrderedPart': (['hasPart'], None, None, None, None),
              'hasTerminalHardware': (['hasPart'], 'DomainElement', 'DomainElement', 'isTerminalHardwareOf', None),
              'isTerminalHardwareOf': (['isPartOf'], 'DomainElement', 'DomainElement', 'hasTerminalHardware', None),
              'hasConstituentEnd': (['hasPart'], 'UmbilicalEnd', 'FunctionLineEnd', 'isConstituentEndOf', None),
              'isConstituentEndOf': (['isPartOf'], 'FunctionLineEnd', 'UmbilicalEnd', 'hasConstituentEnd', None),
              'hasElectricalContactSpecification': (['hasPart'], 'ElectricalConnectorSpecification', 'ElectricalContactSpecification', 'isElectricalContactSpecificationOf', None),
              'isElectricalContactSpecificationOf': (['isPartOf'], 'ElectricalContactSpecification', 'ElectricalConnectorSpecification', 'hasElectricalContactSpecification', None),
              'hasOperatingCondition': (['hasPart'], 'Specification', 'DesignOperatingCondition', None, None),
              'hasOperatingState': (['hasPart'], 'DesignOperatingCondition', 'DesignOperatingState', None, None),
              'hasSpec': (['TechnicalDefinitionRelation'], 'DomainElement', 'Specification', 'isSpecificationOf', None),
              'isSpecificationOf': (['TechnicalDefinitionRelation'], 'Specification', 'DomainElement', 'hasSpec', 'Relates a specification to the domain element that it specifies.'),
              'hasMaterialSpecification': (['hasSpec'], 'DomainElement', 'MaterialSpecification', 'isMaterialSpecificationOf', None),
              'isMaterialSpecificationOf': (['isSpecificationOf'], 'MaterialSpecification', 'DomainElement', 'hasMaterialSpecification', None),
              'hasInterfaceSpecification': (['hasSpec'], 'ConnectionInterface', 'ConnectionInterfaceSpecification', 'isInterfaceSpecificationOf', None),
              'isInterfaceSpecificationOf': (['isSpecificationOf'], 'ConnectionInterfaceSpecification', 'ConnectionInterface', 'hasInterfaceSpecification', None),
              'isDefinedByElectricalContactSpecification': (['hasSpec'], 'ElectricalContact', 'ElectricalContactSpecification', 'specifiesElectricalContact', None),
              'specifiesElectricalContact': (['isSpecificationOf'], 'ElectricalContactSpecification', 'ElectricalContact', 'isDefinedByElectricalContactSpecification', None),
              'hasTechnicalConfiguration': (['TechnicalDefinitionRelation'], 'DomainElement', 'ConfiguredSystem', 'isTechnicalConfigurationOf', 'Relates a domain element to the configured system that defines its technical configuration.'),
              'isTechnicalConfigurationOf': (['TechnicalDefinitionRelation'], 'ConfiguredSystem', 'DomainElement', 'hasTechnicalConfiguration', 'Relates a configured system to the domain element whose technical configuration it defines.'),
              'hasClassificationReference': (['ClassificationRelation'], 'DomainElement', 'ExternalReference', None, None),
              'isClassifiedBy': (['ClassificationRelation'], 'DomainElement', 'DomainVocabularyConcept', 'classifies', 'Relates a domain element to a controlled vocabulary concept used to classify it.'),
              'classifies': (['ClassificationRelation'], 'DomainVocabularyConcept', 'DomainElement', 'isClassifiedBy', 'Relates a controlled vocabulary concept to a domain element classified by that concept.'),
              'hasReadinessStatus': (['isClassifiedBy'], 'OperationalReadinessState', 'OperationalReadinessStatus', None, 'Classifies an operational readiness state by its controlled readiness status.'),
              'hasReadinessConclusion': (['isClassifiedBy'], 'AssessmentOutcome', 'OperationalReadinessStatus', None, 'Classifies an assessment outcome by its controlled readiness conclusion.'),
              'isMatingCompatibleWith': (['CompatibilityRelation'], 'ConnectionInterfaceSpecification', 'ConnectionInterfaceSpecification', None, None),
              'isInterfaceCompatibleWith': (['CompatibilityRelation'], 'ConnectionInterface', 'ConnectionInterface', None, None),
              'hasActivityTarget': (['ParticipationRelation','TargetRelation'], 'Activity', 'DomainElement', 'isTargetOfActivity', 'Relates an activity to the domain element that participates as its semantic target.'),
              'isTargetOfActivity': (['ParticipationRelation','TargetRelation'], 'DomainElement', 'Activity', 'hasActivityTarget', 'Relates a domain element to an activity for which it is the semantic target.'),
              'hasActivityOutcome': (['OutcomeRelation'], 'Activity', 'ActivityOutcome', 'isOutcomeOfActivity', 'Relates an activity to an identifiable outcome of that activity.'),
              'isOutcomeOfActivity': (['OutcomeRelation'], 'ActivityOutcome', 'Activity', 'hasActivityOutcome', 'Relates an activity outcome to the activity that produced or established it.'),
              'hasOutcomeTarget': (['TargetRelation'], 'ActivityOutcome', 'DomainElement', 'isTargetOfOutcome', 'Relates an activity outcome to the domain element that is its target.'),
              'isTargetOfOutcome': (['TargetRelation'], 'DomainElement', 'ActivityOutcome', 'hasOutcomeTarget', 'Relates a domain element to an activity outcome that targets it.'),
              'hasStateOccurrence': (['StateRelation'], 'DomainElement', 'StateOccurrence', 'isStateOf', 'Relates a domain element to an identifiable occurrence of a state borne by it.'),
              'isStateOf': (['StateRelation'], 'StateOccurrence', 'DomainElement', 'hasStateOccurrence', 'Relates a state occurrence to the domain element that bears the state.'),
              'isAbout': (['AboutnessRelation'], 'InformationArtifact', 'DomainElement', 'isSubjectOf', 'Relates an information artifact to the domain element that is its subject.'),
              'isSubjectOf': (['AboutnessRelation'], 'DomainElement', 'InformationArtifact', 'isAbout', 'Relates a domain element to an information artifact that is about it.'),
              'hasDocument': (['isSubjectOf'], 'DomainElement', 'ReferenceDocument', 'documents', None),
              'documents': (['isAbout'], 'ReferenceDocument', 'DomainElement', 'hasDocument', 'Relates a reference document to the domain element it documents.'),
              'concerns': (['isAbout'], 'Issue', 'DomainElement', 'isConcernedByIssue', 'Relates an issue to the domain element that it concerns.'),
              'isConcernedByIssue': (['isSubjectOf'], 'DomainElement', 'Issue', 'concerns', 'Relates a domain element to an issue that concerns it.'),
              'hasEvidence': (['EvidenceRelation'], 'DomainElement', 'Evidence', 'isEvidenceFor', None),
              'isEvidenceFor': (['EvidenceRelation'], 'Evidence', 'DomainElement', 'hasEvidence', 'Relates an evidence artifact to the domain element for which it serves as evidence.'),
              'hasIssue': (['IssueTrackingRelation'], 'Activity', 'Issue', 'isTrackedInActivity', None),
              'isTrackedInActivity': (['IssueTrackingRelation'], 'Issue', 'Activity', 'hasIssue', 'Relates an issue to the activity in which it is tracked.'),
              'hasSparePart': (['ProvisionRelation'], 'Asset', None, 'isSpareFor', None),
              'isSpareFor': (['ProvisionRelation'], None, 'Asset', 'hasSparePart', 'Relates an item provisioned as a spare to the asset for which it is a spare.'),
              'spatiallyContains': (['SpatialRelation'], 'Location', 'DomainElement', 'isSpatiallyContainedIn', None),
              'isSpatiallyContainedIn': (['SpatialRelation'], 'DomainElement', 'Location', 'spatiallyContains', 'Relates a domain element to the location that spatially contains it.'),
              'hasReferenceDatum': (['SpatialRelation'], 'InstallationPoint', 'Feature', 'isReferenceDatumFor', None),
              'isReferenceDatumFor': (['SpatialRelation'], 'Feature', 'InstallationPoint', 'hasReferenceDatum', 'Relates a feature used as a reference datum to the installation point for which it is the datum.'),
              'hasLongitudinalDirectionReference': (['SpatialRelation'], 'InstallationPoint', 'Feature', 'isLongitudinalDirectionReferenceFor', 'Relates an installation point to the feature used as its longitudinal direction reference.'),
              'isLongitudinalDirectionReferenceFor': (['SpatialRelation'], 'Feature', 'InstallationPoint', 'hasLongitudinalDirectionReference', 'Relates a feature to the installation point for which it provides the longitudinal direction reference.'),
              'isCoincidentWith': (['SpatialRelation'], 'Feature', 'Feature', None, None),
              'isInterfaceConnectedTo': (['ConnectionRelation','isInterfaceCompatibleWith'], 'ConnectionInterface', 'ConnectionInterface', None, None),
              'isConnectedTo': (['isInterfaceConnectedTo'], 'ConnectionPoint', 'ConnectionPoint', None, None),
              'isElementConnectedTo': (['ConnectionRelation'], 'DomainElement', 'DomainElement', None, None),
              'connectsInterface': (['ConnectionRelation'], 'PhysicalConnection', 'ConnectionInterface', 'interfaceRealizedBy', None),
              'interfaceRealizedBy': (['ConnectionRelation'], 'ConnectionInterface', 'PhysicalConnection', 'connectsInterface', None),
              'connectsPoint': (['connectsInterface'], 'PhysicalConnection', 'ConnectionPoint', 'connectionRealizedBy', None),
              'connectionRealizedBy': (['interfaceRealizedBy'], 'ConnectionPoint', 'PhysicalConnection', 'connectsPoint', None),
              'isInterconnectedBy': (['ConnectionRelation'], 'DomainElement', 'Interconnection', 'interconnects', 'Relates a domain element to an interconnection that interconnects it.'),
              'interconnects': (['ConnectionRelation'], 'Interconnection', 'DomainElement', 'isInterconnectedBy', 'Relates an interconnection to a domain element that it interconnects.'),
              'hasFeature': (['FeatureDependenceRelation'], 'DomainElement', 'Feature', 'isFeatureOf', 'Relates a domain element to a dependent feature that it carries.'),
              'isFeatureOf': (['FeatureDependenceRelation'], 'Feature', 'DomainElement', 'hasFeature', 'Relates a dependent feature to the domain element that carries it.'),
              'hasAttachmentPoint': (['hasFeature'], 'DomainElement', 'AttachmentPoint', 'isAttachmentPointOf', None),
              'isAttachmentPointOf': (['isFeatureOf'], 'AttachmentPoint', 'DomainElement', 'hasAttachmentPoint', None),
              'hasMountingPoint': (['hasAttachmentPoint'], 'DomainElement', 'MountingPoint', None, None),
              'hasInstallationPoint': (['hasAttachmentPoint'], 'DomainElement', 'InstallationPoint', None, None),
              'hasConnectionInterface': (['hasFeature'], 'DomainElement', 'ConnectionInterface', 'isConnectionInterfaceOf', None),
              'isConnectionInterfaceOf': (['isFeatureOf'], 'ConnectionInterface', 'DomainElement', 'hasConnectionInterface', None),
              'hasConnectionPoint': (['hasConnectionInterface'], 'DomainElement', 'ConnectionPoint', 'isConnectionPointOf', None),
              'isConnectionPointOf': (['isConnectionInterfaceOf'], 'ConnectionPoint', 'DomainElement', 'hasConnectionPoint', None),
              'hasEnd': (['hasFeature'], 'DomainElement', 'LinearEnd', 'isEndOf', None),
              'isEndOf': (['isFeatureOf'], 'LinearEnd', 'DomainElement', 'hasEnd', None),
              'hasElectricalContact': (['hasFeature'], 'ElectricPort', 'ElectricalContact', 'isElectricalContactOf', None),
              'isElectricalContactOf': (['isFeatureOf'], 'ElectricalContact', 'ElectricPort', 'hasElectricalContact', None),
              'exposesInterface': (['InterfaceExposureRelation'], 'LinearEnd', 'ConnectionInterface', 'isInterfaceExposedAt', 'Relates a linear end to a connection interface exposed at that end without asserting feature ownership.'),
              'isInterfaceExposedAt': (['InterfaceExposureRelation'], 'ConnectionInterface', 'LinearEnd', 'exposesInterface', 'Relates a connection interface to a linear end at which that interface is exposed.'),
              'exposesServiceInterface': (['exposesInterface'], 'LinearEnd', 'ConnectionInterface', 'isServiceInterfaceExposedAt', None),
              'isServiceInterfaceExposedAt': (['isInterfaceExposedAt'], 'ConnectionInterface', 'LinearEnd', 'exposesServiceInterface', None),
              'serves': (['FunctionalRelation'], 'DomainElement', 'DomainElement', 'isServedBy', None),
              'isServedBy': (['FunctionalRelation'], 'DomainElement', 'DomainElement', 'serves', 'Relates a domain element to another domain element that serves it.'),
              'hosts': (['FunctionalRelation'], 'DomainElement', 'DomainElement', 'isHostedBy', None),
              'isHostedBy': (['FunctionalRelation'], 'DomainElement', 'DomainElement', 'hosts', 'Relates a domain element to the domain element that hosts it.'),
              'terminatesEnd': (['FunctionalRelation'], 'DomainElement', 'LinearEnd', 'isTerminatedBy', None),
              'isTerminatedBy': (['FunctionalRelation'], 'LinearEnd', 'DomainElement', 'terminatesEnd', None),
              'belongsToGroup': (['MembershipRelation'], 'DomainElement', None, 'hasMember', None),
              'hasMember': (['MembershipRelation'], None, 'DomainElement', 'belongsToGroup', 'Relates an identifiable grouping to a domain element that is its member; the grouping domain remains intentionally unspecified pending PT-08/PT-11.'),
              'hasResponsibleAgent': (['ResponsibilityRelation'], 'DomainElement', 'Agent', 'isResponsibleFor', None),
              'isResponsibleFor': (['ResponsibilityRelation'], 'Agent', 'DomainElement', 'hasResponsibleAgent', 'Relates an agent to a domain element for which the agent is assigned responsibility.'),
          }

          def subject_name(block):
              m = re.match(r'edo:([^\s]+)\s+a\s+', block)
              return m.group(1) if m else None

          def rebuild(block, parents=None, domain=None, range_=None, inverse=None):
              lines = block.splitlines()
              header=[]; sections=[]; cur=None
              for line in lines:
                  m = re.match(r'^    ([A-Za-z_][\w-]*:[\w-]+)\s+', line)
                  if m:
                      if cur: sections.append(cur)
                      cur=[m.group(1), [line]]
                  else:
                      if cur: cur[1].append(line)
                      else: header.append(line)
              if cur: sections.append(cur)
              managed={'rdfs:subPropertyOf','rdfs:domain','rdfs:range','owl:inverseOf'}
              keep=[s for s in sections if s[0] not in managed]
              add=[]
              if parents:
                  if len(parents)==1:
                      val=f'edo:{parents[0]}'
                  else:
                      val=',\n        '.join(f'edo:{x}' for x in parents)
                  add.append(['rdfs:subPropertyOf',[f'    rdfs:subPropertyOf {val}']])
              if domain: add.append(['rdfs:domain',[f'    rdfs:domain edo:{domain}']])
              if range_: add.append(['rdfs:range',[f'    rdfs:range edo:{range_}']])
              if inverse: add.append(['owl:inverseOf',[f'    owl:inverseOf edo:{inverse}']])
              allsec=keep+add
              # Make all predicate sections syntactically complete.
              for idx,(_,slines) in enumerate(allsec):
                  last=len(slines)-1
                  punct='.' if idx==len(allsec)-1 else ';'
                  slines[last]=re.sub(r'\s*[;.](\s*)$', r'\1', slines[last]).rstrip()+f' {punct}'
              return '\n'.join(header + [ln for _,ss in allsec for ln in ss])

          byname={}
          for i in range(0,len(parts),2):
              n=subject_name(parts[i])
              if n: byname[n]=i

          created=[]; updated=[]
          # Families first.
          for name,(parent,definition) in family_defs.items():
              if name in byname:
                  i=byname[name]
                  parts[i]=rebuild(parts[i],[parent],None,None,None); updated.append(name)
              else:
                  label=re.sub(r'(?<!^)(?=[A-Z])',' ',name)
                  block=(f'edo:{name} a owl:ObjectProperty ;\n'
                         f'    dcterms:identifier "{name}" ;\n'
                         f'    rdfs:label "{label}"@en ;\n'
                         f'    skos:definition "{definition}"@en ;\n'
                         f'    rdfs:subPropertyOf edo:{parent} .')
                  parts.extend(['\n\n',block]); byname[name]=len(parts)-1; created.append(name)

          # Ensure preserved top-level families stay directly under DomainRelation.
          for name in ['AttributeRelation','PartWholeRelation','TechnicalDefinitionRelation','ProvisionRelation','SpatialRelation','ConnectionRelation','FunctionalRelation']:
              if name not in byname: raise SystemExit(f'Missing preserved family {name}')
              i=byname[name]; parts[i]=rebuild(parts[i],['DomainRelation'],None,None,None); updated.append(name)

          for name,(parents,domain,range_,inverse,definition) in specs.items():
              if name in byname:
                  i=byname[name]
                  parts[i]=rebuild(parts[i],parents,domain,range_,inverse); updated.append(name)
              else:
                  label=re.sub(r'(?<!^)(?=[A-Z])',' ',name).replace('is ','Is ',1).replace('has ','Has ',1)
                  pred=[]
                  if parents:
                      pv=',\n        '.join(f'edo:{x}' for x in parents)
                      pred.append(('rdfs:subPropertyOf',pv))
                  if domain: pred.append(('rdfs:domain',f'edo:{domain}'))
                  if range_: pred.append(('rdfs:range',f'edo:{range_}'))
                  if inverse: pred.append(('owl:inverseOf',f'edo:{inverse}'))
                  block=[f'edo:{name} a owl:ObjectProperty ;', f'    dcterms:identifier "{name}" ;', f'    rdfs:label "{label}"@en ;']
                  if definition: block.append(f'    skos:definition "{definition}"@en ;')
                  for k,v in pred: block.append(f'    {k} {v} ;')
                  block[-1]=block[-1][:-1]+'.'
                  parts.extend(['\n\n','\n'.join(block)]); byname[name]=len(parts)-1; created.append(name)

          out=''.join(parts)
          P.write_text(out,encoding='utf-8')
          print('created',len(created),created)
          print('updated',len(set(updated)))
          PY

      - name: Verify P52/P53 structure and protected deferrals
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')

          family_parents={
            'ClassificationRelation':'DomainRelation','CompatibilityRelation':'DomainRelation','ParticipationRelation':'DomainRelation',
            'OutcomeRelation':'DomainRelation','TargetRelation':'DomainRelation','StateRelation':'DomainRelation','AboutnessRelation':'DomainRelation',
            'EvidenceRelation':'DomainRelation','IssueTrackingRelation':'DomainRelation','FeatureDependenceRelation':'DomainRelation',
            'MembershipRelation':'DomainRelation','ResponsibilityRelation':'DomainRelation','InterfaceExposureRelation':'SpatialRelation'}
          for c,p in family_parents.items():
              assert (EDO[c],RDF.type,OWL.ObjectProperty) in g,(c,'not ObjectProperty')
              assert (EDO[c],RDFS.subPropertyOf,EDO[p]) in g,(c,'wrong parent')

          # Selected high-risk structural assertions spanning every newly introduced family.
          expected=[
            ('hasPart','PartWholeRelation','DomainElement','DomainElement','isPartOf'),
            ('isPartOf','PartWholeRelation','DomainElement','DomainElement','hasPart'),
            ('hasTask','hasPart','Process','Task',None),
            ('hasSpec','TechnicalDefinitionRelation','DomainElement','Specification','isSpecificationOf'),
            ('isSpecificationOf','TechnicalDefinitionRelation','Specification','DomainElement','hasSpec'),
            ('hasTechnicalConfiguration','TechnicalDefinitionRelation','DomainElement','ConfiguredSystem','isTechnicalConfigurationOf'),
            ('hasClassificationReference','ClassificationRelation','DomainElement','ExternalReference',None),
            ('isClassifiedBy','ClassificationRelation','DomainElement','DomainVocabularyConcept','classifies'),
            ('hasActivityTarget','ParticipationRelation','Activity','DomainElement','isTargetOfActivity'),
            ('hasActivityOutcome','OutcomeRelation','Activity','ActivityOutcome','isOutcomeOfActivity'),
            ('hasOutcomeTarget','TargetRelation','ActivityOutcome','DomainElement','isTargetOfOutcome'),
            ('hasStateOccurrence','StateRelation','DomainElement','StateOccurrence','isStateOf'),
            ('isAbout','AboutnessRelation','InformationArtifact','DomainElement','isSubjectOf'),
            ('hasEvidence','EvidenceRelation','DomainElement','Evidence','isEvidenceFor'),
            ('hasIssue','IssueTrackingRelation','Activity','Issue','isTrackedInActivity'),
            ('spatiallyContains','SpatialRelation','Location','DomainElement','isSpatiallyContainedIn'),
            ('hasFeature','FeatureDependenceRelation','DomainElement','Feature','isFeatureOf'),
            ('exposesInterface','InterfaceExposureRelation','LinearEnd','ConnectionInterface','isInterfaceExposedAt'),
            ('connectsInterface','ConnectionRelation','PhysicalConnection','ConnectionInterface','interfaceRealizedBy'),
            ('isInterconnectedBy','ConnectionRelation','DomainElement','Interconnection','interconnects'),
            ('serves','FunctionalRelation','DomainElement','DomainElement','isServedBy'),
            ('hosts','FunctionalRelation','DomainElement','DomainElement','isHostedBy'),
            ('belongsToGroup','MembershipRelation','DomainElement',None,'hasMember'),
            ('hasResponsibleAgent','ResponsibilityRelation','DomainElement','Agent','isResponsibleFor')]
          for n,p,d,r,inv in expected:
              assert (EDO[n],RDFS.subPropertyOf,EDO[p]) in g,(n,'parent')
              if d: assert (EDO[n],RDFS.domain,EDO[d]) in g,(n,'domain')
              if r: assert (EDO[n],RDFS.range,EDO[r]) in g,(n,'range')
              if inv: assert (EDO[n],OWL.inverseOf,EDO[inv]) in g or (EDO[inv],OWL.inverseOf,EDO[n]) in g,(n,'inverse')

          # Multiple inheritance approved for target participation and detailed connectivity.
          for p in ('ParticipationRelation','TargetRelation'):
              assert (EDO.hasActivityTarget,RDFS.subPropertyOf,EDO[p]) in g
              assert (EDO.isTargetOfActivity,RDFS.subPropertyOf,EDO[p]) in g
          assert (EDO.isInterfaceConnectedTo,RDFS.subPropertyOf,EDO.ConnectionRelation) in g
          assert (EDO.isInterfaceConnectedTo,RDFS.subPropertyOf,EDO.isInterfaceCompatibleWith) in g

          # Explicit deferrals MUST NOT be implemented.
          assert not any(g.triples((EDO.ConstitutionRelation,None,None))), 'ConstitutionRelation must remain absent (PT-04)'
          assert (EDO.hasConnectionMechanism,RDFS.subPropertyOf,EDO.ConnectionRelation) in g, 'ConnectionMechanism pair must remain untouched until PT-07'
          assert not any(g.triples((EDO.belongsToGroup,RDFS.range,None))), 'belongsToGroup range intentionally pending'
          assert not any(g.triples((EDO.hasMember,RDFS.domain,None))), 'hasMember domain intentionally pending'

          # No accidental global properties forbidden by P53.
          for n in ('hasPart','spatiallyContains','belongsToGroup','isClassifiedBy'):
              assert (EDO[n],RDF.type,OWL.TransitiveProperty) not in g,(n,'must not be transitive')

          print('triples',len(g))
          print('families',len(family_parents),'OK')
          print('high_risk_properties',len(expected),'OK')
          print('protected_deferrals OK')
          PY
          git diff --check
          git diff --stat

      - name: Commit verified Lot 2 and remove runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot2-pt02-taxonomy.yml
          git add core/edo-object-relations.ttl
          git diff --cached --check
          git commit -m "Implement PT-02 relation taxonomy"
          git push origin HEAD:audit-evolution-phase-a-implementation
