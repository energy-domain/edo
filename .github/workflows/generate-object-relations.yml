name: Generate object-relations ontology

on:
  push:
    branches: [main]
    paths:
      - core/edo.ttl
      - tools/generate_edo_object_relations.py
      - tools/fix_generated_object_relation_uris.py
      - tools/add_physical_joints.py
      - tools/add_attachment_positioning.py
      - tools/generalize_connection_interfaces.py
      - tools/cleanup_legacy_connection_terms.py
      - tools/add_clamped_joint.py
      - tools/add_galvanic_connection.py
      - tools/refine_anode_collar_model.py
      - tools/add_linear_end_model.py
      - tools/refine_flexible_pipe_segment_model.py
      - tools/add_umbilical_topology.py
      - tools/refine_umbilical_termination_model.py
      - tools/complete_function_line_termination.py
      - tools/add_connection_interface_specification.py
      - tools/add_flange_interface_specification.py
      - tools/add_hydraulic_connector_specification.py
      - tools/add_electrical_interface_specialization.py
      - tools/add_electrical_interface_specification_attributes.py
      - tools/add_electrical_contact_model.py
      - tools/add_electrical_contact_specification_bridge.py
      - tools/add_electrical_connector_port_model.py
      - tools/add_panel_electrical_connector.py
      - tools/add_connectorized_electrical_cable_end.py
      - tools/add_electrical_splice_termination.py
      - tools/add_optical_interface_model.py
      - tools/add_optical_connector_termination.py
      - tools/add_optical_splice_termination.py
      - tools/migrate_structural_domain_relations.py
      - tools/migrate_process_domain_relations.py
      - tools/migrate_operational_domain_relations.py
      - tools/fix_owl_structural_property_roles.py
      - tools/cleanup_orphan_anonymous_classes.py
      - tools/audit_connection_topology.py
      - tools/audit_interface_specifications.py
      - tools/audit_electrical_interface_specification_attributes.py
      - tools/audit_electrical_contacts.py
      - tools/audit_electrical_connector_ports.py
      - tools/audit_panel_electrical_connector.py
      - tools/audit_connectorized_electrical_cable_end.py
      - tools/audit_electrical_splice_termination.py
      - tools/audit_optical_interfaces.py
      - tools/audit_optical_connector_termination.py
      - tools/audit_optical_splice_termination.py
      - tools/audit_umbilical_connections.py
      - tools/audit_structural_domain_relation_migration.py
      - tools/audit_process_domain_relations.py
      - tools/audit_operational_domain_relation_migration.py
      - tools/audit_owl_structural_property_roles.py
      - tools/audit_domain_metamodel_annotations.py
      - tools/audit_protege_owl_readiness.py
      - tools/audit_domain_relation_migration.py
      - .github/workflows/generate-object-relations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rdflib
      - run: python tools/generate_edo_object_relations.py
      - run: python tools/fix_generated_object_relation_uris.py
      - run: python tools/add_physical_joints.py
      - run: python tools/add_attachment_positioning.py
      - run: python tools/generalize_connection_interfaces.py
      - run: python tools/cleanup_legacy_connection_terms.py
      - run: python tools/add_clamped_joint.py
      - run: python tools/add_galvanic_connection.py
      - run: python tools/refine_anode_collar_model.py
      - run: python tools/add_linear_end_model.py
      - run: python tools/refine_flexible_pipe_segment_model.py
      - run: python tools/add_umbilical_topology.py
      - run: python tools/refine_umbilical_termination_model.py
      - run: python tools/complete_function_line_termination.py
      - run: python tools/add_connection_interface_specification.py
      - run: python tools/add_flange_interface_specification.py
      - run: python tools/add_hydraulic_connector_specification.py
      - run: python tools/add_electrical_interface_specialization.py
      - run: python tools/add_electrical_interface_specification_attributes.py
      - run: python tools/add_electrical_contact_model.py
      - run: python tools/add_electrical_contact_specification_bridge.py
      - run: python tools/add_electrical_connector_port_model.py
      - run: python tools/add_panel_electrical_connector.py
      - run: python tools/add_connectorized_electrical_cable_end.py
      - run: python tools/add_electrical_splice_termination.py
      - run: python tools/add_optical_interface_model.py
      - run: python tools/add_optical_connector_termination.py
      - run: python tools/add_optical_splice_termination.py
      - run: python tools/migrate_structural_domain_relations.py
      - run: python tools/migrate_process_domain_relations.py
      - run: python tools/migrate_operational_domain_relations.py
      - run: python tools/fix_owl_structural_property_roles.py
      - run: python tools/cleanup_orphan_anonymous_classes.py
      - name: Audit connection topology
        run: python tools/audit_connection_topology.py
      - name: Audit interface specifications
        run: python tools/audit_interface_specifications.py
      - name: Audit electrical interface specification attributes
        run: python tools/audit_electrical_interface_specification_attributes.py
      - name: Audit electrical contacts
        run: python tools/audit_electrical_contacts.py
      - name: Audit electrical connector ports
        run: python tools/audit_electrical_connector_ports.py
      - name: Audit panel electrical connector
        run: python tools/audit_panel_electrical_connector.py
      - name: Audit connectorized electrical cable ends
        run: python tools/audit_connectorized_electrical_cable_end.py
      - name: Audit electrical splice termination
        run: python tools/audit_electrical_splice_termination.py
      - name: Audit optical interfaces
        run: python tools/audit_optical_interfaces.py
      - name: Audit optical connector termination
        run: python tools/audit_optical_connector_termination.py
      - name: Audit optical splice termination
        run: python tools/audit_optical_splice_termination.py
      - name: Audit umbilical connections
        run: python tools/audit_umbilical_connections.py
      - name: Audit structural DomainRelation migration
        run: python tools/audit_structural_domain_relation_migration.py
      - name: Audit process DomainRelation migration
        run: python tools/audit_process_domain_relations.py
      - name: Audit operational DomainRelation migration
        run: python tools/audit_operational_domain_relation_migration.py
      - name: Audit OWL structural property roles
        run: python tools/audit_owl_structural_property_roles.py
      - name: Audit DomainMetamodelAnnotation usage
        run: python tools/audit_domain_metamodel_annotations.py
      - name: Audit Protégé OWL readiness
        run: python tools/audit_protege_owl_readiness.py
      - name: Audit DomainRelation migration inventory
        run: python tools/audit_domain_relation_migration.py
      - name: Validate generated Turtle
        run: |
          python -c "from rdflib import Graph; g=Graph(); g.parse('core/edo-object-relations.ttl', format='turtle'); print(f'validated {len(g)} triples')"
          if grep -q 'https://w3id.org/energy-domain/edo#https://w3id.org/energy-domain/edo#' core/edo-object-relations.ttl; then
            echo 'Malformed duplicated EDO IRI found.'
            exit 1
          fi
      - name: Commit generated ontology and audits
        run: |
          if git diff --quiet -- core/edo-object-relations.ttl core/edo-connection-topology-audit.txt core/edo-interface-specification-audit.txt core/edo-electrical-interface-specification-audit.txt core/edo-electrical-contact-audit.txt core/edo-electrical-connector-port-audit.txt core/edo-panel-electrical-connector-audit.txt core/edo-connectorized-electrical-cable-end-audit.txt core/edo-electrical-splice-termination-audit.txt core/edo-optical-interface-audit.txt core/edo-optical-connector-termination-audit.txt core/edo-optical-splice-termination-audit.txt core/edo-umbilical-connection-audit.txt core/edo-structural-domain-relation-audit.txt core/edo-process-domain-relation-audit.txt core/edo-operational-domain-relation-audit.txt core/edo-owl-structural-property-role-audit.txt core/edo-domain-metamodel-annotation-audit.txt core/edo-protege-owl-readiness-audit.txt core/edo-domain-relation-migration-audit.txt && \
             git ls-files --error-unmatch core/edo-object-relations.ttl >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-connection-topology-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-interface-specification-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-electrical-interface-specification-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-electrical-contact-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-electrical-connector-port-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-panel-electrical-connector-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-connectorized-electrical-cable-end-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-electrical-splice-termination-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-optical-interface-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-optical-connector-termination-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-optical-splice-termination-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-umbilical-connection-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-structural-domain-relation-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-process-domain-relations-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-operational-domain-relation-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-owl-structural-property-role-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-domain-metamodel-annotation-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-protege-owl-readiness-audit.txt >/dev/null 2>&1 && \
             git ls-files --error-unmatch core/edo-domain-relation-migration-audit.txt >/dev/null 2>&1; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/edo-object-relations.ttl core/edo-connection-topology-audit.txt core/edo-interface-specification-audit.txt core/edo-electrical-interface-specification-audit.txt core/edo-electrical-contact-audit.txt core/edo-electrical-connector-port-audit.txt core/edo-panel-electrical-connector-audit.txt core/edo-connectorized-electrical-cable-end-audit.txt core/edo-electrical-splice-termination-audit.txt core/edo-optical-interface-audit.txt core/edo-optical-connector-termination-audit.txt core/edo-optical-splice-termination-audit.txt core/edo-umbilical-connection-audit.txt core/edo-structural-domain-relation-audit.txt core/edo-process-domain-relation-audit.txt core/edo-operational-domain-relation-audit.txt core/edo-owl-structural-property-role-audit.txt core/edo-domain-metamodel-annotation-audit.txt core/edo-protege-owl-readiness-audit.txt core/edo-domain-relation-migration-audit.txt
          git commit -m 'Generate object-relations ontology and audits'
          git push

# regeneration trigger for material-specification relations
# regeneration trigger for AttributeRelation classification
