name: Generate object-relations ontology

on:
  push:
    branches: [main]
    paths:
      - core/edo.ttl
      - tools/generate_edo_object_relations.py
      - .github/workflows/generate-object-relations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rdflib
      - run: python tools/generate_edo_object_relations.py
      - name: Validate generated Turtle
        run: python -c "from rdflib import Graph; g=Graph(); g.parse('core/edo-object-relations.ttl', format='turtle'); print(f'validated {len(g)} triples')"
      - name: Commit generated ontology
        run: |
          if git diff --quiet -- core/edo-object-relations.ttl && git ls-files --error-unmatch core/edo-object-relations.ttl >/dev/null 2>&1; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/edo-object-relations.ttl
          git commit -m 'Generate object-relations ontology'
          git push
