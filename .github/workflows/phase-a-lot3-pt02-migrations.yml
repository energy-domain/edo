name: Phase A Lot 3 PT-02 semantic migrations

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.head_ref == 'audit-evolution-phase-a-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4

      - name: Apply approved PT-02 semantic migrations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          P=Path('core/edo-object-relations.ttl')
          text=P.read_text(encoding='utf-8')

          # Directly approved restriction-property migrations.
          counts={}
          for old,new in [
              ('isDefinedByType','hasTechnicalConfiguration'),
              ('hasSubject','hasActivityTarget'),
              ('hasEndInterface','exposesInterface'),
          ]:
              needle=f'owl:onProperty edo:{old}'
              counts[old]=text.count(needle)
              text=text.replace(needle,f'owl:onProperty edo:{new}')

          if counts['isDefinedByType'] != 1:
              raise SystemExit(f'Expected exactly one isDefinedByType restriction, got {counts["isDefinedByType"]}')
          if counts['hasSubject'] != 1:
              raise SystemExit(f'Expected exactly one hasSubject restriction, got {counts["hasSubject"]}')
          if counts['hasEndInterface'] != 15:
              raise SystemExit(f'Expected 15 hasEndInterface restrictions from audit, got {counts["hasEndInterface"]}')

          # P45: remove the SubseaWell existential; do not replace it by another existential.
          pat=re.compile(
              r'(edo:SubseaWell a owl:Class ;.*?rdfs:subClassOf )'
              r'\[ a owl:Restriction ;\n\s*owl:onProperty edo:hasInterconnection ;\n\s*owl:someValuesFrom edo:Interconnection \],\n\s*\[ a owl:Restriction ;',
              re.S,
          )
          text,n=pat.subn(r'\1[ a owl:Restriction ;',text,count=1)
          if n != 1:
              raise SystemExit(f'Could not remove exactly one SubseaWell hasInterconnection existential: {n}')

          # Helpers for named property blocks.
          parts=re.split(r'(\n{2,})',text)
          byname={}
          for i in range(0,len(parts),2):
              m=re.match(r'edo:([^\s]+)\s+a\s+',parts[i])
              if m: byname[m.group(1)]=i

          def sections(block):
              lines=block.splitlines()
              header=[]; out=[]; cur=None
              for line in lines:
                  m=re.match(r'^    ([A-Za-z_][\w-]*:[\w-]+)\s+',line)
                  if m:
                      if cur: out.append(cur)
                      cur=[m.group(1),[line]]
                  else:
                      if cur: cur[1].append(line)
                      else: header.append(line)
              if cur: out.append(cur)
              return header,out

          def serialize(header,secs):
              for j,(_,ls) in enumerate(secs):
                  punct='.' if j==len(secs)-1 else ';'
                  ls[-1]=re.sub(r'\s*[;.](\s*)$',r'\1',ls[-1]).rstrip()+f' {punct}'
              return '\n'.join(header+[ln for _,ls in secs for ln in ls])

          def deprecate(name,replacements=()):
              i=byname[name]
              h,s=sections(parts[i])
              # Remove normative-family membership and any earlier deprecation/replacement metadata.
              s=[x for x in s if x[0] not in {'rdfs:subPropertyOf','owl:deprecated','dcterms:isReplacedBy'}]
              s.append(['owl:deprecated',['    owl:deprecated "true"^^xsd:boolean']])
              if replacements:
                  vals=',\n        '.join(f'edo:{r}' for r in replacements)
                  s.append(['dcterms:isReplacedBy',[f'    dcterms:isReplacedBy {vals}']])
              parts[i]=serialize(h,s)

          for n,repls in {
              'isDefinedByType':('hasTechnicalConfiguration',),
              'isDefinedByCatalogItem':(),
              'hasSubject':(),
              'hasInterconnection':('isInterconnectedBy',),
              'hasEndInterface':('exposesInterface',),
              'isEndInterfaceOf':('isInterfaceExposedAt',),
              'MaterialRelation':(),
              'InformationRelation':(),
              'InterfaceRelation':(),
              'OrganizationalRelation':(),
          }.items():
              if n not in byname: raise SystemExit(f'Missing resource to deprecate: {n}')
              deprecate(n,repls)

          # P6: the directional alt labels belong to the inverse, not to hasPart.
          i=byname['hasPart']; h,s=sections(parts[i])
          removed=[]; keep=[]
          for pred,ls in s:
              if pred=='skos:altLabel' and any('Part Of' in x or 'É Parte De' in x for x in ls):
                  removed.append((pred,ls))
              else: keep.append((pred,ls))
          if not removed:
              raise SystemExit('Expected directional Part Of altLabels on hasPart were not found')
          parts[i]=serialize(h,keep)

          i=byname['isPartOf']; h,s=sections(parts[i])
          if not any(pred=='skos:altLabel' for pred,_ in s):
              s.append(['skos:altLabel',['    skos:altLabel "Part Of"@en,','        "É Parte De"@pt-br']])
          parts[i]=serialize(h,s)

          # P7: complete the missing inverse definition using the approved semantics.
          i=byname['isConstituentEndOf']; h,s=sections(parts[i])
          if not any(pred=='skos:definition' for pred,_ in s):
              s.append(['skos:definition',[
                  '    skos:definition "Relates a function-line end to the umbilical end of which it is a constituent end."@en,',
                  '        "Relaciona uma extremidade de linha funcional à extremidade de umbilical da qual ela é uma extremidade constituinte."@pt-br'
              ]])
          parts[i]=serialize(h,s)

          # P10: narrow hasSpec definition to Specification, matching its formal range.
          i=byname['hasSpec']; h,s=sections(parts[i])
          s=[x for x in s if x[0] != 'skos:definition']
          s.append(['skos:definition',[
              '    skos:definition "Relates a domain entity to a specification that defines, limits or governs its configuration, selection, use or compatibility."@en,',
              '        "Relaciona uma entidade do domínio a uma especificação que define, limita ou governa sua configuração, seleção, uso ou compatibilidade."@pt-br'
          ]])
          parts[i]=serialize(h,s)

          P.write_text(''.join(parts),encoding='utf-8')
          print('migrated restriction counts',counts)
          print('deprecated resources',10)
          PY

      - name: Verify semantic migration gate
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL, Literal
          from rdflib.namespace import XSD
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          DCT=Namespace('http://purl.org/dc/terms/')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')

          retired_families=['MaterialRelation','InformationRelation','InterfaceRelation','OrganizationalRelation']
          legacy=['isDefinedByType','isDefinedByCatalogItem','hasSubject','hasInterconnection','hasEndInterface','isEndInterfaceOf']
          for n in retired_families+legacy:
              assert (EDO[n],OWL.deprecated,Literal(True,datatype=XSD.boolean)) in g,(n,'not deprecated')
              assert not any(g.triples((EDO[n],RDFS.subPropertyOf,None))),(n,'still in normative hierarchy')

          # Retired families have no direct descendants after the migrations.
          for f in retired_families:
              assert not any(g.triples((None,RDFS.subPropertyOf,EDO[f]))),(f,'still has descendants')

          # Approved replacements.
          def restrictions(prop): return list(g.subjects(OWL.onProperty,EDO[prop]))
          assert len(restrictions('isDefinedByType'))==0
          assert len(restrictions('hasSubject'))==0
          assert len(restrictions('hasInterconnection'))==0
          assert len(restrictions('hasEndInterface'))==0

          # The one inverse max-cardinality residual is deliberately left for PT-03 P78 / Lot 4.
          invres=restrictions('isEndInterfaceOf')
          assert len(invres)==1, f'Expected one deliberate P78 residual, got {len(invres)}'

          # CheckProcess -> hasActivityTarget some DomainElement.
          ok=False
          for r in g.objects(EDO.CheckProcess,RDFS.subClassOf):
              if (r,OWL.onProperty,EDO.hasActivityTarget) in g and (r,OWL.someValuesFrom,EDO.DomainElement) in g: ok=True
          assert ok,'CheckProcess migration missing'

          # FlexiblePipeBody -> exactly 1 FlexiblePipeStructure via hasTechnicalConfiguration.
          ok=False
          for r in g.objects(EDO.FlexiblePipeBody,RDFS.subClassOf):
              if ((r,OWL.onProperty,EDO.hasTechnicalConfiguration) in g and
                  (r,OWL.onClass,EDO.FlexiblePipeStructure) in g and
                  any(int(v)==1 for v in g.objects(r,OWL.qualifiedCardinality))): ok=True
          assert ok,'FlexiblePipeBody technical configuration migration missing'

          # P45 explicitly removes the universal SubseaWell interconnection obligation.
          for r in g.objects(EDO.SubseaWell,RDFS.subClassOf):
              assert (r,OWL.onProperty,EDO.hasInterconnection) not in g
              assert not ((r,OWL.onProperty,EDO.isInterconnectedBy) in g and any(g.objects(r,OWL.someValuesFrom)))

          # Every old hasEndInterface restriction now uses exposesInterface.
          exp=list(g.subjects(OWL.onProperty,EDO.exposesInterface))
          assert len(exp)>=15, f'Expected migrated exposure restrictions, got {len(exp)}'

          # Direct replacement metadata where semantics is one-to-one.
          for old,new in [('isDefinedByType','hasTechnicalConfiguration'),('hasInterconnection','isInterconnectedBy'),('hasEndInterface','exposesInterface'),('isEndInterfaceOf','isInterfaceExposedAt')]:
              assert (EDO[old],DCT.isReplacedBy,EDO[new]) in g,(old,'replacement metadata')

          print('triples',len(g))
          print('deprecated resources OK')
          print('retired family descendants 0')
          print('legacy restrictions migrated; deliberate P78 residual 1')
          print('semantic migration gate OK')
          PY
          git diff --check
          git diff --stat

      - name: Commit verified Lot 3 and remove runner
        shell: bash
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot3-pt02-migrations.yml
          git add core/edo-object-relations.ttl
          git diff --cached --check
          git commit -m "Implement PT-02 semantic relation migrations"
          git push origin HEAD:audit-evolution-phase-a-implementation
