name: Phase A Lot 5 positive restriction matrix audit

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-evolution-phase-a-implementation
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check rdflib==7.1.4
      - name: Audit approved positive OWL delta
        shell: bash
        run: |
          python - <<'PY'
          from rdflib import Graph, Namespace, RDF, RDFS, OWL, URIRef
          EDO=Namespace('https://w3id.org/energy-domain/edo#')
          g=Graph().parse('core/edo-object-relations.ttl',format='turtle')

          def restrictions(c,p):
              return [r for r in g.objects(EDO[c],RDFS.subClassOf) if (r,OWL.onProperty,EDO[p]) in g]
          def exact(c,p,f,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.qualifiedCardinality)) for r in restrictions(c,p))
          def minq(c,p,f,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.minQualifiedCardinality)) for r in restrictions(c,p))
          def maxq(c,p,f,n): return any((r,OWL.onClass,EDO[f]) in g and any(int(v)==n for v in g.objects(r,OWL.maxQualifiedCardinality)) for r in restrictions(c,p))
          def some(c,p,f): return any((r,OWL.someValuesFrom,EDO[f]) in g for r in restrictions(c,p))
          def only(c,p,f): return any((r,OWL.allValuesFrom,EDO[f]) in g for r in restrictions(c,p))
          def union_only(c,p,fillers):
              want={EDO[x] for x in fillers}
              for r in restrictions(c,p):
                  for u in g.objects(r,OWL.allValuesFrom):
                      h=g.value(u,OWL.unionOf)
                      if not h: continue
                      vals=[]
                      while h and h!=RDF.nil:
                          vals.append(g.value(h,RDF.first)); h=g.value(h,RDF.rest)
                      if set(vals)==want: return True
              return False
          checks=[]
          def C(pid,label,fn): checks.append((pid,label,fn()))

          # P13-P31 positive truths.
          C('P13','Asset hasAttribute exactly1 ManufacturingDate',lambda: exact('Asset','hasAttribute','ManufacturingDate',1))
          for f in ['ExternalDiameter','ClampInternalDiameter','SafeWorkingLoad']:
              C('P14-16',f'AnchoringCollar exactly1 {f}',lambda f=f: exact('AnchoringCollar','hasAttribute',f,1))
          for f in ['AnodeCollarsQuantity','AnodeCollarsAxialSpacing']:
              C('P18-19',f'AnodeCollarSet exactly1 {f}',lambda f=f: exact('AnodeCollarSet','hasAttribute',f,1))
          C('P20','AntiWearSheath exactly1 TapesQuantity',lambda: exact('AntiWearSheath','hasAttribute','TapesQuantity',1))
          for f in ['StartOfLifeFloatVolume','StartOfLifeFloatDensity','EndOfLifeFloatVolume','EndOfLifeFloatDensity']:
              C('P23',f'BuoyancyModule exactly1 {f}',lambda f=f: exact('BuoyancyModule','hasAttribute',f,1))
          for f in ['CompositeLayerMaterialType','RuptDefAlongFibers','RuptDefPerpendFibers','UltTensStrAlongFibers','UltTensStrPerpendFibers']:
              C('P24',f'CompositeMaterialSpecification exactly1 {f}',lambda f=f: exact('CompositeMaterialSpecification','hasAttribute',f,1))
          for f in ['RequiredMinWaterDepth','RequiredMaxWaterDepth','RequiredMinimumTemperature','RequiredMaximumTemperature','RequiredInternalDiameter','RequiredBoreType','RequiredDesignLife','RequiredService','RequiredPipeSectionApplication']:
              C('P26-29',f'FlexiblePipeEnvelope exactly1 {f}',lambda f=f: exact('FlexiblePipeEnvelope','hasAttribute',f,1))
          C('P31','FlexiblePipeSegment exactly1 NominalLength',lambda: exact('FlexiblePipeSegment','hasAttribute','NominalLength',1))

          # P54-P64 existentials/minima.
          C('P54','FlexiblePipeEnvelope hasOperatingCondition some DesignOperatingCondition',lambda: some('FlexiblePipeEnvelope','hasOperatingCondition','DesignOperatingCondition'))
          C('P59/P62','CheckProcess hasActivityTarget some DomainElement',lambda: some('CheckProcess','hasActivityTarget','DomainElement'))
          C('P60','WetChristmasTree hasPart some ConnectionModule',lambda: some('WetChristmasTree','hasPart','ConnectionModule'))
          C('P61','FloatingProductionUnit hasPart some RiserBalcony',lambda: some('FloatingProductionUnit','hasPart','RiserBalcony'))
          C('P63','RiserSupport hasConnectionPoint some ConnectionPoint',lambda: some('RiserSupport','hasConnectionPoint','ConnectionPoint'))
          C('P64','Process hasTask min1 Task',lambda: minq('Process','hasTask','Task',1))

          # P65-P70 closures.
          C('P65','HubMatingConnection partner union closure',lambda: union_only('HubMatingConnection','isConnectedTo',['FlowConnectorMatingConnection','ConnectionModuleMatingConnection','HubBlockCapMatingConnection','HubProtectionCapMatingConnection']))
          for c in ['FlowConnectorMatingConnection','ConnectionModuleMatingConnection','HubBlockCapMatingConnection','HubProtectionCapMatingConnection']:
              C('P66',f'{c} only HubMatingConnection',lambda c=c: only(c,'isConnectedTo','HubMatingConnection'))
          for a,b in [('HotStabMatingConnection','HotStabReceptacleMatingConnection'),('HotStabReceptacleMatingConnection','HotStabMatingConnection'),('EndFittingCrimpedConnection','FlexiblePipeCrimpedConnection'),('FlexiblePipeCrimpedConnection','EndFittingCrimpedConnection'),('AnodeGalvanicConnectionPoint','ProtectedStructureGalvanicConnectionPoint'),('ProtectedStructureGalvanicConnectionPoint','AnodeGalvanicConnectionPoint')]:
              C('P67',f'{a} isConnectedTo only {b}',lambda a=a,b=b: only(a,'isConnectedTo',b))
          C('P67','CollarClampingSurface isInterfaceConnectedTo only PipeClampingSurface',lambda: only('CollarClampingSurface','isInterfaceConnectedTo','PipeClampingSurface'))
          C('P67','PipeClampingSurface isInterfaceConnectedTo only CollarClampingSurface',lambda: only('PipeClampingSurface','isInterfaceConnectedTo','CollarClampingSurface'))
          C('P67','FlangeConnection isConnectedTo only FlangeConnection',lambda: only('FlangeConnection','isConnectedTo','FlangeConnection'))
          C('P67','WeldedConnection isConnectedTo only WeldedConnection',lambda: only('WeldedConnection','isConnectedTo','WeldedConnection'))
          C('P68','ConnectionInterface exactly1 interface specification',lambda: exact('ConnectionInterface','hasInterfaceSpecification','ConnectionInterfaceSpecification',1))
          for c,f in [('ChainSegment','MechanicalConnectionPoint'),('RopeSegment','MechanicalConnectionPoint'),('PipeSegment','FluidPort'),('HydraulicJumper','FluidPort'),('HydraulicJumperConnector','FluidPort'),('PanelHydraulicConnector','FluidPort'),('PanelElectricalConnector','ElectricalConnectorPort'),('PanelOpticalConnector','OpticalConnectorPort'),('Jumper','Port'),('ElectricalJumper','ElectricalControlConnectorPort'),('ElectricalJumperConnector','ElectricalControlConnectorPort'),('ElectricalPowerJumper','ElectricalPowerConnectorPort'),('ElectricalPowerJumperConnector','ElectricalPowerConnectorPort'),('FiberOpticJumper','OpticalConnectorPort')]:
              C('P69/P70',f'{c} hasConnectionPoint only {f}',lambda c=c,f=f: only(c,'hasConnectionPoint',f))

          # P72-P80.
          C('P72','FlexiblePipeSegment hasPart exactly1 FlexiblePipeBody',lambda: exact('FlexiblePipeSegment','hasPart','FlexiblePipeBody',1))
          C('P72','FlexiblePipeSegment hasPart exactly2 EndFitting',lambda: exact('FlexiblePipeSegment','hasPart','EndFitting',2))
          C('P72','FlexiblePipeSegment hasPart closure body/endfitting',lambda: union_only('FlexiblePipeSegment','hasPart',['FlexiblePipeBody','EndFitting']))
          C('P73','hasInstalledAncillary property exists',lambda: (EDO.hasInstalledAncillary,RDF.type,OWL.ObjectProperty) in g)
          C('P73','isInstalledAncillaryOf property exists',lambda: (EDO.isInstalledAncillaryOf,RDF.type,OWL.ObjectProperty) in g)
          C('P74','PhysicalConnection connectsInterface min2',lambda: minq('PhysicalConnection','connectsInterface','ConnectionInterface',2))
          # P75 participant structures.
          for c,f in [('GalvanicConnection','AnodeGalvanicConnectionPoint'),('GalvanicConnection','ProtectedStructureGalvanicConnectionPoint'),('ClampedJoint','CollarClampingSurface'),('ClampedJoint','PipeClampingSurface'),('FlexiblePipeCrimpedJoint','FlexiblePipeCrimpedConnection'),('FlexiblePipeCrimpedJoint','EndFittingCrimpedConnection')]:
              C('P75',f'{c} connectsPoint exactly1 {f}',lambda c=c,f=f: exact(c,'connectsPoint',f,1))
          C('P75','GalvanicConnection connectsPoint closure',lambda: union_only('GalvanicConnection','connectsPoint',['AnodeGalvanicConnectionPoint','ProtectedStructureGalvanicConnectionPoint']))
          C('P75','ClampedJoint connectsPoint closure',lambda: union_only('ClampedJoint','connectsPoint',['CollarClampingSurface','PipeClampingSurface']))
          C('P75','FlexiblePipeCrimpedJoint connectsPoint closure',lambda: union_only('FlexiblePipeCrimpedJoint','connectsPoint',['FlexiblePipeCrimpedConnection','EndFittingCrimpedConnection']))
          C('P75','FlangedJoint connectsPoint exactly2 FlangeConnection',lambda: exact('FlangedJoint','connectsPoint','FlangeConnection',2))
          C('P75','FlangedJoint connectsPoint only FlangeConnection',lambda: only('FlangedJoint','connectsPoint','FlangeConnection'))
          C('P75','WeldedJoint connectsPoint exactly2 WeldedConnection',lambda: exact('WeldedJoint','connectsPoint','WeldedConnection',2))
          C('P75','WeldedJoint connectsPoint only WeldedConnection',lambda: only('WeldedJoint','connectsPoint','WeldedConnection'))
          C('P76','ConnectionPoint isConnectedTo max1',lambda: maxq('ConnectionPoint','isConnectedTo','ConnectionPoint',1))
          for c,p,f in [('AttachmentPoint','isAttachmentPointOf','DomainElement'),('ConnectionInterface','isConnectionInterfaceOf','DomainElement'),('ConnectionPoint','isConnectionPointOf','DomainElement'),('LinearEnd','isEndOf','DomainElement'),('ElectricalContact','isElectricalContactOf','ElectricPort')]:
              C('P77',f'{c} {p} exactly1 {f}',lambda c=c,p=p,f=f: exact(c,p,f,1))
          for c,f in [('ConnectorizedElectricalCableEnd','Connector'),('ConnectorizedOpticalFiberCableEnd','Connector'),('SplicedElectricalCableEnd','ElectricalSpliceBox'),('SplicedOpticalFiberCableEnd','OpticalSpliceBox')]:
              C('P79',f'{c} isTerminatedBy min1 {f}',lambda c=c,f=f: minq(c,'isTerminatedBy',f,1))
          C('P79','UTA terminatesEnd exactly1 UmbilicalEnd',lambda: exact('UTA','terminatesEnd','UmbilicalEnd',1))
          C('P79','UTA terminatesEnd only UmbilicalEnd',lambda: only('UTA','terminatesEnd','UmbilicalEnd'))
          C('P79','FlexiblePipeSegmentEnd isTerminatedBy exactly1 EndFitting',lambda: exact('FlexiblePipeSegmentEnd','isTerminatedBy','EndFitting',1))
          C('P80','ConnectionInterface isInterfaceConnectedTo max1',lambda: maxq('ConnectionInterface','isInterfaceConnectedTo','ConnectionInterface',1))

          # P81-P90.
          C('P81','InstallationPoint hasReferenceDatum exactly1 Feature',lambda: exact('InstallationPoint','hasReferenceDatum','Feature',1))
          C('P81','InstallationPoint direction reference exactly1 Feature',lambda: exact('InstallationPoint','hasLongitudinalDirectionReference','Feature',1))
          C('P81','InstallationPoint RequiredLongitudinalPosition exactly1',lambda: exact('InstallationPoint','hasAttribute','RequiredLongitudinalPosition',1))
          C('P83','OperationalReadinessState exists',lambda: any(g.triples((EDO.OperationalReadinessState,None,None))))
          C('P84','AnodeCollarSet hasPart min1 AnodeCollar',lambda: minq('AnodeCollarSet','hasPart','AnodeCollar',1))
          C('P85','LinearObject hasEnd exactly2 LinearEnd',lambda: exact('LinearObject','hasEnd','LinearEnd',2))
          C('P85','FunctionLine hasEnd exactly2 FunctionLineEnd',lambda: exact('FunctionLine','hasEnd','FunctionLineEnd',2))
          C('P85/P88','FlexiblePipeBody hasEnd exactly2 FlexiblePipeBodyEnd',lambda: exact('FlexiblePipeBody','hasEnd','FlexiblePipeBodyEnd',2))
          C('P86','UmbilicalSegment hasPart min1 FunctionLine',lambda: minq('UmbilicalSegment','hasPart','FunctionLine',1))
          C('P86','UmbilicalEnd hasConstituentEnd min1 FunctionLineEnd',lambda: minq('UmbilicalEnd','hasConstituentEnd','FunctionLineEnd',1))
          C('P86','UmbilicalEnd exposesServiceInterface min1 ConnectionInterface',lambda: minq('UmbilicalEnd','exposesServiceInterface','ConnectionInterface',1))
          C('P86','FunctionLineEnd isConstituentEndOf exactly1 UmbilicalEnd',lambda: exact('FunctionLineEnd','isConstituentEndOf','UmbilicalEnd',1))
          C('P86/P99','FunctionLineEnd exposesInterface min1 ConnectionInterface',lambda: minq('FunctionLineEnd','exposesInterface','ConnectionInterface',1))
          C('P87','Connector hasConnectionPoint min2 ConnectionPoint',lambda: minq('Connector','hasConnectionPoint','ConnectionPoint',2))
          C('P87','ElectricalSpliceBox min2 ElectricalSplicePort',lambda: minq('ElectricalSpliceBox','hasConnectionPoint','ElectricalSplicePort',2))
          C('P87','TubingCoupling exactly2 FluidPort',lambda: exact('TubingCoupling','hasConnectionPoint','FluidPort',2))
          C('P87','TubingCoupling only FluidPort',lambda: only('TubingCoupling','hasConnectionPoint','FluidPort'))
          C('P88','FlexiblePipeBody hasEnd only FlexiblePipeBodyEnd',lambda: only('FlexiblePipeBody','hasEnd','FlexiblePipeBodyEnd'))
          C('P88','FlexiblePipeBody exactly2 crimped points',lambda: exact('FlexiblePipeBody','hasConnectionPoint','FlexiblePipeCrimpedConnection',2))
          C('P88','FlexiblePipeBody only crimped points',lambda: only('FlexiblePipeBody','hasConnectionPoint','FlexiblePipeCrimpedConnection'))
          C('P88','FlexiblePipeBody exactly1 FlexiblePipeStructure',lambda: exact('FlexiblePipeBody','hasTechnicalConfiguration','FlexiblePipeStructure',1))
          C('P89','EndFitting exactly1 FlangeConnection',lambda: exact('EndFitting','hasConnectionPoint','FlangeConnection',1))
          C('P89','EndFitting exactly1 EndFittingCrimpedConnection',lambda: exact('EndFitting','hasConnectionPoint','EndFittingCrimpedConnection',1))
          C('P89','EndFitting connection point union closure',lambda: union_only('EndFitting','hasConnectionPoint',['FlangeConnection','EndFittingCrimpedConnection']))

          # P91-P102.
          C('P91','UTA hasTerminalHardware min1 DomainElement',lambda: minq('UTA','hasTerminalHardware','DomainElement',1))
          for c,f in [('FlowConnector','FlowConnectorMatingConnection'),('ConnectionModule','ConnectionModuleMatingConnection'),('Hub','HubMatingConnection'),('HubBlockCap','HubBlockCapMatingConnection'),('HubProtectionCap','HubProtectionCapMatingConnection'),('HotStab','HotStabMatingConnection'),('HotStabReceptacle','HotStabReceptacleMatingConnection')]:
              C('P92',f'{c} exactly1 {f}',lambda c=c,f=f: exact(c,'hasConnectionPoint',f,1))
          C('P93','FlangeAdapter exactly2 FlangeConnection',lambda: exact('FlangeAdapter','hasConnectionPoint','FlangeConnection',2))
          C('P93','FlangeAdapter only FlangeConnection',lambda: only('FlangeAdapter','hasConnectionPoint','FlangeConnection'))
          for c in ['BuoyancyModule','HangOffCollar','StopperCollar','AnodeCollar']:
              C('P94',f'{c} exactly1 MountingPoint',lambda c=c: exact(c,'hasMountingPoint','MountingPoint',1))
          for c in ['SplitCollar','HangOffCollar']:
              C('P95',f'{c} exactly1 CollarClampingSurface',lambda c=c: exact(c,'hasConnectionInterface','CollarClampingSurface',1))
          for c,f in [('FlowConnector','FluidPort'),('LineTermination','ConnectionPoint'),('PipeTermination','FluidPort'),('Valve','FluidPort'),('OpticalSpliceBox','OpticalSplicePort')]:
              C('P96',f'{c} min2 {f}',lambda c=c,f=f: minq(c,'hasConnectionPoint',f,2))
          C('P96','OpticalSpliceBox only OpticalSplicePort',lambda: only('OpticalSpliceBox','hasConnectionPoint','OpticalSplicePort'))
          C('P97','FlexibleStructure hasOrderedPart min2 FlexibleStructureLayer',lambda: minq('FlexibleStructure','hasOrderedPart','FlexibleStructureLayer',2))
          C('P97','FlexibleStructure hasOrderedPart only FlexibleStructureLayer',lambda: only('FlexibleStructure','hasOrderedPart','FlexibleStructureLayer'))
          C('P98','FlexibleStructureLayer exactly1 MaterialSpecification',lambda: exact('FlexibleStructureLayer','hasMaterialSpecification','MaterialSpecification',1))
          for c,f in [('FlexiblePipeSegmentEnd','FlangeConnection'),('FlexiblePipeBodyEnd','FlexiblePipeCrimpedConnection')]:
              C('P99',f'{c} exposesInterface exactly1 {f}',lambda c=c,f=f: exact(c,'exposesInterface',f,1))
              C('P99',f'{c} exposesInterface only {f}',lambda c=c,f=f: only(c,'exposesInterface',f))
          for c,f in [('FunctionLineEnd','FunctionLine'),('ElectricalCableEnd','ElectricalCable'),('ElectricalControlCableEnd','ElectricalControlCable'),('ElectricalPowerCableEnd','ElectricalPowerCable'),('OpticalFiberCableEnd','OpticalFiberCable'),('TubingEnd','Tubing'),('UmbilicalEnd','UmbilicalSegment')]:
              C('P100',f'{c} isEndOf only {f}',lambda c=c,f=f: only(c,'isEndOf',f))
          C('P101','PipeClampingSurface carrier only PipeSegment',lambda: only('PipeClampingSurface','isConnectionInterfaceOf','PipeSegment'))
          C('P102','ElectricalContact exactly1 ContactIdentifier',lambda: exact('ElectricalContact','hasAttribute','ContactIdentifier',1))
          C('P102','ElectricalContactSpecification exactly1 ContactIdentifier',lambda: exact('ElectricalContactSpecification','hasAttribute','ContactIdentifier',1))
          C('P102','ElectricalContactSpecification exactly1 parent spec',lambda: exact('ElectricalContactSpecification','isElectricalContactSpecificationOf','ElectricalConnectorSpecification',1))
          C('P102','ElectricalContact bridge max1 spec',lambda: maxq('ElectricalContact','isDefinedByElectricalContactSpecification','ElectricalContactSpecification',1))

          missing=[(p,l) for p,l,ok in checks if not ok]
          present=[(p,l) for p,l,ok in checks if ok]
          print('CHECKS',len(checks),'PRESENT',len(present),'MISSING',len(missing))
          for p,l in missing: print('MISSING',p,l)
          # P83 is a planned future-class case, report distinctly if that is the only absent resource.
          print('OperationalReadinessState_exists',any(g.triples((EDO.OperationalReadinessState,None,None))))
          print('hasInstalledAncillary_exists',(EDO.hasInstalledAncillary,RDF.type,OWL.ObjectProperty) in g)
          print('triples',len(g))
          PY
      - name: Remove audit runner
        run: |
          git config user.name "EDO Phase A Implementation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/phase-a-lot5-positive-matrix-audit.yml
          git commit -m "Record Lot 5 positive restriction matrix audit"
          git push origin HEAD:audit-evolution-phase-a-implementation
